<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02085c">
<title>SGTST Pocket</title>
<style>
:root{
  /* cores de segurança (NBR 7195 / NR-26): vermelho = combate a incêndio, amarelo = atenção,
     verde = segurança e primeiros socorros, azul = informação */
  --bg:#eef0f1; --surface:#ffffff; --surface2:#f3f5f6; --ink:#1a1c1e; --muted:#5b6268; --line:#d6dadd;
  --head:#202427; --head-ink:#ffffff;
  --glass:#f2b705; --glass-ink:#1a1c1e; --glass-soft:#fff1bd; --focus:#1a1c1e;
  --yellow:#f2b705; --fire:#c8102e;
  --red:#c8102e; --red-soft:#fbe0e3; --amber:#7a5c00; --amber-soft:#fff0b8; --ok:#00853f; --ok-soft:#d9f0e2;
  --blue:#0b5cad; --blue-soft:#dce9f7;
  --r-sm:8px; --r:12px;
  --stripe:repeating-linear-gradient(-45deg,#f2b705 0 11px,#1a1c1e 11px 22px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121416; --surface:#1c1f22; --surface2:#24282c; --ink:#eceef0; --muted:#9aa2a9; --line:#30353a;
    --head:#0c0e0f; --focus:#f2b705;
    --glass-soft:#3a3011;
    --red:#ff6b6b; --red-soft:#3b1a1e; --amber:#f2c94c; --amber-soft:#352c10; --ok:#4cc982; --ok-soft:#15301f;
    --blue:#7fb2ee; --blue-soft:#17283d;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--head);color:var(--head-ink);min-height:58px;border-bottom:7px solid;border-image:var(--stripe) 7}
.top .logo{flex:none;width:30px;height:30px}
.top h1{font-size:19px;font-weight:650;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.iconbtn{background:none;border:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:inherit;flex:none}
.iconbtn:active{background:rgba(255,255,255,.18)}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;opacity:.95;background:rgba(0,0,0,.14);padding:4px 10px;border-radius:99px;border:0;color:inherit;cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:#bbb;display:block}
.sync[data-s=ok] i{background:#7be0a4}.sync[data-s=sync] i{background:#ffd36b}.sync[data-s=erro] i{background:#ff8a8a}.sync[data-s=offline] i{background:#c8c8c8}
main{flex:1;overflow-y:auto;padding:14px 14px 24px;-webkit-overflow-scrolling:touch}
.wrap{max-width:760px;margin:0 auto}
nav.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button{position:relative}
nav.tabs button[aria-current=page]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current=page]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;border-radius:0 0 4px 4px;background:var(--yellow)}
nav.tabs button[aria-current=page] svg{color:var(--fire)}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

h2{font-size:17px;margin:22px 0 10px;font-weight:650;letter-spacing:-.01em}
h2:first-child{margin-top:4px}
.muted{color:var(--muted)}.small{font-size:13.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack>*+*{margin-top:10px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}

/* placa "dias sem acidente" */
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:auto 1fr;overflow:hidden}
.board{border:0;box-shadow:inset 0 0 0 1px var(--line)}
.board .num{background:var(--ok);color:#fff;padding:14px 18px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:112px}
.board .num b{font-size:46px;line-height:1;font-variant-numeric:tabular-nums;font-weight:750;letter-spacing:-.03em}
.board .num span{font-size:12.5px;margin-top:4px;opacity:.95}
.board .txt{padding:12px 14px;display:flex;flex-direction:column;justify-content:center}
.board .txt strong{font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;border-left:7px solid var(--line)}
.tile b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:13.5px;color:var(--muted)}
.tile.red{border-left-color:var(--red)}.tile.red b{color:var(--red)}
.tile.amber{border-left-color:var(--yellow)}.tile.amber b{color:var(--amber)}
.tile.gray{border-left-color:var(--muted)}.tile.gray b{color:var(--ink)}
.tile.blue{border-left-color:var(--blue)}.tile.blue b{color:var(--blue)}
.tile.ok{border-left-color:var(--ok)}.tile.ok b{color:var(--ok)}
.mods{display:grid;gap:14px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:flex;gap:16px;align-items:center;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit}
.mod:active{background:var(--surface2)}
.mod .mico{flex:none;width:64px;height:64px;display:flex;align-items:center;justify-content:center}
.mod .mico svg{width:56px;height:56px}
.mod h3{margin:0;font-size:20px}
.mod p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.mod.ext{border-left:8px solid var(--red)}.mod.occ{border-left:8px solid var(--yellow)}.mod.ck{border-left:8px solid var(--blue)}
.seg input:checked+span.na{background:var(--muted);color:#fff}
.ckitem{border-bottom:1px solid var(--line)}.ckitem:last-child{border-bottom:0}.ckitem .check{border-bottom:0;flex-wrap:wrap}.ckitem .check>span{flex:1 1 200px}
.ckitem .seg span{min-width:48px;padding:9px 10px}.ncnote{padding:0 0 10px}
.crit{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:800;vertical-align:1px}
details.more{margin-top:18px}details.more summary{cursor:pointer;font-weight:600;padding:8px 0}
.progress{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress>i{display:block;height:100%;background:var(--glass)}

/* listas */
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%}
.card:active{background:var(--surface2)}
.asset{flex:none;width:58px;text-align:center;display:flex;flex-direction:column;align-items:center}
.asset .ico{width:40px;height:40px;margin-bottom:2px}
.btn.primary{font-weight:700}
h2 .ico{width:22px;height:22px;vertical-align:-4px;margin-right:6px}
.occico{flex:none;width:38px;height:38px}
.card.occ-ACIDENTE{border-left:6px solid var(--red)}.card.occ-INCIDENTE{border-left:6px solid var(--yellow)}
.asset small{display:block;font-size:11px;color:var(--muted);line-height:1}
.asset b{display:block;font-size:20px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.02em}
.card .title{font-weight:600}
.card .sub{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* medidor de validade */
.gauge{margin-top:7px;display:flex;align-items:center;gap:8px}
.gauge .bar{flex:1;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.gauge .bar i{display:block;height:100%;border-radius:99px}
.gauge small{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.s-ok .bar i{background:var(--ok)}.s-warn .bar i{background:var(--yellow)}.s-venc .bar i{background:var(--red)}.s-rec .bar i{background:var(--blue)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-warn{background:var(--amber-soft);color:var(--amber)}.c-venc{background:var(--red-soft);color:var(--red)}.c-rec{background:var(--blue-soft);color:var(--blue)}.c-n{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:14px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--glass);color:var(--glass-ink);border-color:var(--glass)}
.search{width:100%;padding:11px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);margin-bottom:10px}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}

/* detalhe */
.dl{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:8px 12px;margin:0}
.dl dt{color:var(--muted);font-size:14px}.dl dd{margin:0;word-break:break-word}
.hero{display:flex;gap:14px;align-items:center}
.hero .big{font-size:40px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:44px}
.btn.primary{background:var(--glass);color:var(--glass-ink);border-color:var(--glass)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.timeline li:last-child{border-bottom:0}
.why{list-style:none;padding:0;margin:0;counter-reset:w}
.why li{position:relative;padding:0 0 14px 38px;counter-increment:w}
.why li::before{content:counter(w);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--yellow);color:#1a1c1e;display:grid;place-items:center;font-weight:700;font-size:14px}
.why li::after{content:"";position:absolute;left:12px;top:28px;bottom:2px;width:2px;background:var(--line)}
.why li:last-child::after{display:none}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos figure{margin:0;position:relative;aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;padding:4px}
.photos img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photos button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:26px;height:26px;cursor:pointer}

/* formulários */
form .field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
form label.lbl{font-size:14px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],input:not([type]),select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);min-height:46px}
textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0 0 12px;background:var(--surface)}
legend{font-weight:650;padding:0 6px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
details.sec>summary{padding:14px;font-weight:650;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.sec>summary::after{content:"+";font-size:22px;color:var(--muted);line-height:1}
details.sec[open]>summary::after{content:"–"}
details.sec>.in{padding:0 14px 6px}
.check{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;flex:none}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:9px 14px;font-weight:600;font-size:14px;min-width:58px;text-align:center}
.seg input:checked+span.ok{background:var(--ok);color:#fff}
.seg input:checked+span.nc{background:var(--red);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:-3px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags label{position:relative}
.tags input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.tags span{display:block;padding:6px 11px;border:1px solid var(--line);border-radius:99px;font-size:14px;background:var(--surface2)}
.tags input:checked+span{background:var(--glass);border-color:var(--glass);color:var(--glass-ink)}
.tags input:focus-visible+span{outline:3px solid var(--focus)}
.addtag{display:flex;gap:6px;margin-top:6px}
.addtag input{flex:1}
.sticky-save{position:sticky;bottom:-24px;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 8px;margin-top:6px}
.banner{background:var(--amber-soft);color:var(--ink);border:1px solid var(--amber);border-radius:var(--r);padding:10px 12px;font-size:14px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14.5px;z-index:50;max-width:90vw;text-align:center;animation:t .2s ease-out}
@keyframes t{from{opacity:0;transform:translate(-50%,8px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
dialog{border:0;border-radius:var(--r);padding:18px;background:var(--surface);color:var(--ink);width:min(92vw,440px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.welcome{max-width:460px;margin:30px auto;text-align:center}
.welcome h2{font-size:24px}
.hidden{display:none!important}
.scanner{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;max-height:60vh;margin:0 auto;width:100%}
.scanner video{width:100%;height:100%;object-fit:cover;display:block}
.scanner .frame{position:absolute;inset:20% 14%;border:3px solid rgba(255,255,255,.92);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.38)}
.scanner .msg{position:absolute;left:12px;right:12px;bottom:14px;text-align:center;color:#fff;font-size:14.5px;text-shadow:0 1px 3px #000}
.qrbox{background:#fff;border-radius:var(--r-sm);padding:8px;display:inline-block;flex:none;line-height:0}
.scanbig{width:100%;min-height:58px;font-size:17px}

/* ===== riscos e desvios ===== */
.btn.riskbig{background:var(--yellow);color:#1a1c1e;border:2px solid #1a1c1e;min-height:62px;font-size:17.5px;font-weight:800;gap:10px;box-shadow:0 3px 0 #1a1c1e}
.btn.riskbig:active{transform:translateY(2px);box-shadow:0 1px 0 #1a1c1e}
.btn.riskbig svg{width:30px;height:30px}
.btn.aibtn{background:linear-gradient(90deg,#02085c,#3b2a8f);color:#fff;border:0;min-height:54px;font-size:16.5px;font-weight:700}
.btn.aibtn:disabled{opacity:.75}
.mod.risk{border-left:8px solid var(--yellow)}
.chip.c-crit{background:#5a0010;color:#fff}
.card.risk .thumb{flex:none;width:52px;height:52px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.card.hot{border-left:6px solid var(--red)}
.lvl{display:flex;align-items:center;justify-content:space-between;border-radius:var(--r-sm);padding:10px 14px;margin:0 0 12px;font-size:14px;border:1px solid var(--line);background:var(--surface2)}
.lvl b{font-size:18px}
.lvl.lv-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.lvl.lv-warn{background:var(--amber-soft);color:var(--amber);border-color:var(--yellow)}
.lvl.lv-venc{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.lvl.lv-crit{background:#5a0010;color:#fff;border-color:#5a0010}
/* ===== dashboard ===== */
.wrap.wide{max-width:1180px}
.dashlink{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;background:var(--head);color:#fff;border:0;border-left:8px solid var(--brand-red);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left}
.dashlink svg{width:26px;height:26px;color:var(--brand-red);flex:none}
.dashlink span{flex:1}.dashlink small{display:block;opacity:.8;font-size:13px}
.lcard{background:var(--surface2);border:1px solid var(--line);border-radius:18px;margin:0 0 14px;overflow:hidden}
.lcard>header{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--line)}
.lcard h3{flex:1;margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.addbtn{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:var(--brand-red);color:#fff;font-size:26px;line-height:1;cursor:pointer;font-weight:500}
.lrows{padding:10px;display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 5px 5px 16px;min-height:58px}
.lrow .nm{flex:1;min-width:0;font-weight:600;font-size:16.5px;overflow-wrap:anywhere}
.lrow .ct{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
.lrow .ib{flex:none;width:44px;height:44px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.lrow .ib.del{color:var(--brand-red)}
.lrow .ib:active{background:var(--surface2)}
.lrow.editing{border-color:var(--brand-red);box-shadow:0 0 0 3px rgba(255,42,12,.14);padding-left:8px}
.lrow.editing input{flex:1;min-width:0;min-height:44px}
.lrow.editing .btn{min-height:44px;padding:8px 12px}
.lmiss{background:var(--amber-soft);border:1px solid var(--amber);border-radius:12px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lmiss .btn{min-height:36px;padding:6px 10px;margin-left:auto}
.dhead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.dhead h2{margin:0}
.presbtn{background:var(--head);color:#fff;border-color:var(--head)}
.presbtn svg{color:var(--brand-red)}
.dbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.dbar .filters{margin:0;padding:2px 0;flex:1 1 300px}
.dbar select{width:auto;min-height:40px;padding:6px 10px;max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media(min-width:760px){.kpis{grid-template-columns:repeat(5,1fr)}}
.kpis .kpi:last-child:nth-child(odd){grid-column:1/-1}
@media(min-width:760px){.kpis .kpi:last-child:nth-child(odd){grid-column:auto}}
.kpi{background:var(--surface);padding:14px 16px;border-top:5px solid var(--brand-red)}
.kpi b{display:block;font-size:34px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.kpi span{display:block;font-size:14px;font-weight:600;margin-top:2px}
.kpi small{display:block;font-size:12.5px;color:var(--muted)}
.dgrid{display:grid;gap:12px;margin-top:12px}
@media(min-width:900px){.dgrid{grid-template-columns:1fr 1fr}.dgrid .span2{grid-column:1/-1}}
.dpanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.dpanel h3{margin:0;font-size:16.5px;letter-spacing:-.01em}
.dpanel .lead{margin:2px 0 14px;font-size:13.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;height:210px}
.cols .c{display:flex;flex-direction:column;min-width:0}
.cols .bw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-height:0}
.cols .bw i{display:block;width:100%;max-width:46px;background:var(--bar);border-radius:5px 5px 0 0}
.cols .bw em{font-style:normal;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:3px;white-space:nowrap}
.cols .c>span{font-size:11.5px;color:var(--muted);text-align:center;margin-top:5px;border-top:2px solid var(--line);padding-top:4px}
.cols .c.out .bw i{opacity:.35}
.cols .c.now>span{color:var(--ink);font-weight:700;border-top-color:var(--ink)}
.hb{display:flex;flex-direction:column;gap:10px}
.hb .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:14px}
.hb .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .v{font-weight:700;font-variant-numeric:tabular-nums}
.hb .t{grid-column:1/-1;height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--bar);border-radius:99px}
.hb.red .t i{background:var(--red)}.hb.warn .t i{background:var(--yellow)}.hb.blue .t i{background:var(--blue)}
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.statrow:last-child{margin-bottom:0}
.stat{border-left:5px solid var(--line);padding:2px 0 2px 10px;min-width:0}
.stat b{display:block;font-size:26px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.02em}
.stat span{display:block;font-size:13px;color:var(--muted)}
.stat.red{border-color:var(--red)}.stat.red b{color:var(--red)}
.stat.amber{border-color:var(--yellow)}
.stat.ok{border-color:var(--ok)}.stat.ok b{color:var(--ok)}
.stat.blue{border-color:var(--blue)}
.stat b.txt{font-size:17px;line-height:1.25;padding-top:6px;white-space:normal!important}
@media(max-width:560px){.stat b{font-size:20px}.stat span{font-size:12px}.statrow{gap:8px}}
.dnote{margin:12px 0 0;font-size:13px;color:var(--muted)}

/* ===== modo apresentação ===== */
.pres{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  --bg:#020638;--surface:rgba(255,255,255,.07);--surface2:rgba(255,255,255,.12);--ink:#f2f3fa;--muted:#aeb3d6;--line:rgba(255,255,255,.16);
  --red:#ff6b6b;--ok:#4cc982;--blue:#7fb2ee;--amber:#f2c94c;--amber-soft:#352c10;--ok-soft:#15301f;--red-soft:#3b1a1e;--focus:#f2b705;
  background:linear-gradient(165deg,#030a62 0%,#020638 55%,#02041f 100%);color:var(--ink);color-scheme:dark;--bar:#ff2a0c;--brand-red:#ff2a0c;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.pres .stripe{height:8px;background:#ff2a0c;flex:none}
.pres .stage{flex:1;overflow:auto;padding:clamp(18px,3.4vw,60px) clamp(18px,4.5vw,80px);display:flex}
.pres .slide{flex:1;display:flex;flex-direction:column;max-width:1500px;width:100%;margin:0 auto;animation:sf .28s ease-out}
@keyframes sf{from{opacity:0;transform:translateX(18px)}}
@media (prefers-reduced-motion:reduce){.pres .slide{animation:none}}
.pres .st{font-size:clamp(26px,3.5vw,54px);margin:0;letter-spacing:-.025em;line-height:1.08;font-weight:750}
.pres .sub{font-size:clamp(14px,1.45vw,21px);color:var(--muted);margin:.4em 0 0}
.pres .body{flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:clamp(16px,4vh,48px)}
.pres .foot{display:flex;align-items:center;gap:10px;padding:10px clamp(12px,3vw,40px);border-top:1px solid var(--line);font-size:14px;color:var(--muted);flex:none}
.pres .foot button{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:99px;min-width:44px;height:44px;padding:0 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pres .foot button[aria-pressed=true]{background:#ff2a0c;color:#fff;border-color:#ff2a0c}
.pres .foot svg{width:18px;height:18px}
.pres .prog{flex:1;display:flex;gap:4px;min-width:40px}
.pres .prog i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.pres .prog i.on{background:#ff2a0c}
.pres .prog i.done{background:#7a3a52}
.pres .count{font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.pres .kpis{background:transparent;border:0;gap:clamp(14px,2.4vw,40px);overflow:visible}
.pres .kpi{background:transparent;padding:clamp(10px,2vh,22px) 0 0;border-top-width:7px}
.pres .kpi b{font-size:clamp(46px,7.4vw,124px)}
.pres .kpi span{font-size:clamp(15px,1.6vw,24px)}
.pres .kpi small{font-size:clamp(13px,1.2vw,18px)}
.pres .cols{height:clamp(220px,52vh,560px);gap:clamp(6px,1vw,16px)}
.pres .cols .bw i{max-width:90px}
.pres .cols .bw em{font-size:clamp(12px,1.25vw,20px)}
.pres .cols .c>span{font-size:clamp(11px,1.15vw,17px)}
.pres .hb{gap:clamp(12px,2.2vh,22px)}
.pres .hb .r{font-size:clamp(15px,1.7vw,25px)}
.pres .hb .t{height:clamp(12px,1.8vh,22px)}
.pres .statrow{gap:clamp(14px,2.4vw,40px);margin-bottom:clamp(12px,3vh,36px)}
.pres .stat{border-left-width:8px;padding-left:clamp(10px,1.2vw,20px)}
.pres .stat b{font-size:clamp(28px,4.3vw,72px);white-space:nowrap}
.pres .stat b.txt{font-size:clamp(18px,2vw,32px)}
.pres .stat span{font-size:clamp(13px,1.4vw,21px)}
.split{display:grid;gap:18px}
@media(min-width:1180px){.dpanel .split{grid-template-columns:1fr 1fr}}
.pres .split{display:grid;gap:clamp(18px,3vw,56px)}
@media(min-width:900px){.pres .split{grid-template-columns:1fr 1fr;align-items:start}}
.pres table.t{font-size:clamp(14px,1.4vw,21px)}
.pres .dnote{font-size:clamp(13px,1.2vw,18px)}
.cover{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,3vh,34px)}
.cover img{height:clamp(110px,22vh,230px);width:auto;align-self:flex-start}
.cover h1{font-size:clamp(40px,7.2vw,124px);margin:0;line-height:.98;letter-spacing:-.035em;font-weight:800}
.cover .what{font-size:clamp(20px,2.6vw,42px);margin:0;color:#ff2a0c;font-weight:650;letter-spacing:-.01em}
.cover .per{font-size:clamp(14px,1.5vw,22px);color:var(--muted);margin:0;border-top:1px solid var(--line);padding-top:clamp(10px,2vh,20px);max-width:40em}

.lcard{background:var(--surface2);border:1px solid var(--line);border-radius:18px;margin:0 0 14px;overflow:hidden}
.lcard>header{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--line)}
.lcard h3{flex:1;margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.addbtn{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:var(--brand-red);color:#fff;font-size:26px;line-height:1;cursor:pointer;font-weight:500}
.lrows{padding:10px;display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 5px 5px 16px;min-height:58px}
.lrow .nm{flex:1;min-width:0;font-weight:600;font-size:16.5px;overflow-wrap:anywhere}
.lrow .ct{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
.lrow .ib{flex:none;width:44px;height:44px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.lrow .ib.del{color:var(--brand-red)}
.lrow .ib:active{background:var(--surface2)}
.lrow.editing{border-color:var(--brand-red);box-shadow:0 0 0 3px rgba(255,42,12,.14);padding-left:8px}
.lrow.editing input{flex:1;min-width:0;min-height:44px}
.lrow.editing .btn{min-height:44px;padding:8px 12px}
.lmiss{background:var(--amber-soft);border:1px solid var(--amber);border-radius:12px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lmiss .btn{min-height:36px;padding:6px 10px;margin-left:auto}

/* ===== identidade Tempermax (coruja) ===== */
:root{--brand:#02085c;--brand-red:#ff2a0c;--bar:#02085c;--head:#02085c;--glass:#02085c;--glass-ink:#ffffff;--glass-soft:#e2e5fa;--focus:#02085c;--stripe:linear-gradient(#ff2a0c,#ff2a0c)}
@media (prefers-color-scheme: dark){:root{--head:#02064a;--glass:#3f4ce0;--glass-soft:#1c2056;--bar:#7d8bff;--focus:#f2b705}}
.top{border-bottom-width:5px!important}
.top .logo{flex:none;height:38px;width:auto;display:block}
nav.tabs button[aria-current=page]::before{background:var(--brand-red)}
nav.tabs button[aria-current=page] svg{color:var(--brand-red)}
.btn.primary{color:var(--glass-ink)}
.owlbadge{width:112px;height:112px;border-radius:28px;background:linear-gradient(170deg,#02085c,#030724);display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 0 0 4px var(--brand-red)}
.owlbadge img{height:84px;width:auto;display:block}
.board .num{background:var(--ok)}

/* ===== cruz da segurança ===== */
.cruzwrap{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
.cznav{display:flex;align-items:center;gap:10px;justify-content:center}
.cznav b{min-width:11em;text-align:center;font-size:16px}
.cznav .ib{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.cznav .ib:disabled{opacity:.35}
.cruz{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;width:100%;max-width:520px}
.cz{aspect-ratio:1;border-radius:5px;display:grid;place-items:center;position:relative;font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(12px,3.3vw,19px);line-height:1}
.cz[style*="span 3"]{aspect-ratio:3/1}
.cz.k-ok{background:#1f9d55;color:#fff}
.cz.k-inc{background:#f2b705;color:#1a1c1e}
.cz.k-acc{background:#d7262e;color:#fff}
.cz.k-fut{background:var(--surface2);color:var(--muted);border:1px dashed var(--line)}
.cz.none{border:1px dashed var(--line);opacity:.45}
.cz.today{outline:3px solid var(--ink);outline-offset:1px;z-index:1}
.cz small{position:absolute;top:2px;right:3px;font-size:9.5px;font-weight:700;opacity:.9}
.czleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);justify-content:center}
.czleg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.czleg i.k-ok{background:#1f9d55}.czleg i.k-inc{background:#f2b705}.czleg i.k-acc{background:#d7262e}
.czsplit{display:grid;gap:18px;align-items:center}
@media(min-width:760px){.czsplit{grid-template-columns:1.35fr 1fr}}
.czhome{cursor:pointer}
.czhome .cruz{max-width:380px}
table.placar{width:100%;border-collapse:separate;border-spacing:0 3px;font-size:14px}
table.placar caption{font-weight:700;text-align:left;padding-bottom:6px;font-size:15px}
table.placar th{text-align:left;font-weight:600;padding:7px 10px;border-radius:6px 0 0 6px}
table.placar td{text-align:right;font-weight:800;padding:7px 12px;border-radius:0 6px 6px 0;font-variant-numeric:tabular-nums;width:3.5em}
.p-com th,.p-com td{background:#d7262e;color:#fff}
.p-sem th,.p-sem td{background:#f08c00;color:#fff}
.p-ps th,.p-ps td{background:#f2b705;color:#1a1c1e}
.p-quase th,.p-quase td{background:#fff3bf;color:#5c4400}
.p-cond th,.p-cond td{background:#c3eadb;color:#0b4d36}
.p-ato th,.p-ato td{background:#8fd6bd;color:#0b4d36}
.p-tot th,.p-tot td{background:#2b3036;color:#fff}
.p-gt th,.p-gt td{background:#02085c;color:#fff}
.cols.c2 .bw2{flex:1;display:flex;gap:2px;min-height:0}
.cols.c2 .bw2 .bw{flex:1}
.cols .bw i.ba{background:#d7262e}.cols .bw i.bi{background:#f2b705}
.pres .cruz{max-width:min(78vh,720px)}
.pres .costwrap .cols{height:clamp(150px,30vh,320px)}
@media(min-width:900px){.pres .czsplit{grid-template-columns:1.7fr 1fr}}
.pres .cz{font-size:clamp(14px,2.1vw,28px)}
.pres .cznav b{font-size:clamp(16px,1.6vw,24px)}
.pres table.placar{font-size:clamp(14px,1.45vw,22px)}
.pres table.placar caption{font-size:clamp(15px,1.6vw,24px);color:var(--ink)}
.pres .czleg{font-size:clamp(13px,1.2vw,18px)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;padding:6px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tscroll{overflow-x:auto}
.pres table.t th{font-size:clamp(12px,1.1vw,17px)}
.pres table.t td{padding:clamp(6px,1.2vh,12px) 8px}
</style>
</head>

<div id="app">
  <header class="top">
    <button class="iconbtn hidden" id="backbtn" aria-label="Voltar"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <img class="logo" id="hdrlogo" alt="Tempermax">
    <h1 id="title">SGTST Pocket</h1>

    <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
    <button data-tab="exts"><svg viewBox="0 0 24 24"><rect x="7" y="8" width="8" height="14" rx="3.5"/><path d="M9 5h4v3H9zM9 5l7-2M14 6c3 .5 5 2.5 5 6v6"/></svg>Extintores</button>

    <button data-tab="checks"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3M8.5 11l1.5 1.5 3-3M8.5 16.5l1.5 1.5 3-3"/></svg>Checklists</button>

	}

VIEWS.exts = (r) => {
  const f = r.f || 'all', q = (r.q||'').toLowerCase(), u = r.u || '';
  let ex = [...(S.extinguishers||[])].sort(sortAsset);
  if(u) ex = ex.filter(e => e.unitId===u);
  if(f==='venc') ex = ex.filter(e => extStatus(e).k==='venc');
  if(f==='warn') ex = ex.filter(e => extStatus(e).k==='warn');
  if(f==='rec') ex = ex.filter(e => extStatus(e).k==='rec');
  if(f==='noinsp') ex = ex.filter(e => !inspectedThisMonth(e.id));
  if(q) ex = ex.filter(e => [e.asset,e.type,e.capacity,placePath(e),e.notes,e.inmetro].join(' ').toLowerCase().includes(q));
  const F = [['all','Todos'],['venc','Vencidos'],['warn','A vencer'],['rec','Em recarga'],['noinsp','Sem inspeção no mês']];
  const units = S.units||[];
  const all = S.extinguishers||[];
  const cnt = k => all.filter(e => extStatus(e).k===k).length;
  const insp = all.filter(e => inspectedThisMonth(e.id)).length;
  const pctInsp = all.length ? Math.round(insp/all.length*100) : 0;
  const mes = new Date().toLocaleDateString('pt-BR',{month:'long'});
  const hist = (S.history||[]).filter(h => h.extId).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,8);
  return { title:'Extintores', html:`
    <button class="btn primary scanbig" id="scan" style="margin-bottom:12px">${ICON.qr} Ler QR code do extintor</button>

      <button class="tile amber" data-f="warn"><b>${cnt('warn')}</b><span>A vencer</span></button>
      <button class="tile blue" data-f="rec"><b>${cnt('rec')}</b><span>Em recarga</span></button>

      <div class="row small"><span class="grow">Inspeções de ${mes}</span><b>${insp} de ${all.length}</b></div>
      <div class="progress" style="margin-top:6px" role="progressbar" aria-valuenow="${pctInsp}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pctInsp}%"></i></div>
    </div>
    <input class="search" type="search" placeholder="Buscar por número, tipo ou local" value="${esc(r.q||'')}" id="q" aria-label="Buscar extintor">
    <div class="filters" role="group" aria-label="Filtros">${F.map(([k,l])=>`<button data-f="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}
      ${units.length>1 ? `<button data-u="" aria-pressed="${!u}">Todas as unidades</button>${units.map(x=>`<button data-u="${x.id}" aria-pressed="${u===x.id}">${esc(x.name)}</button>`).join('')}`:''}

  `, after(){
    const qi = $('#q'); qi.oninput = () => { r.q = qi.value; const pos = qi.selectionStart; render(); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos); };
    document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { r.f = b.dataset.f; render(); });
    document.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { r.u = b.dataset.u; render(); });
    $('#newext').onclick = () => go('extForm', {});
    $('#scan').onclick = () => go('scan');
    $('#labels').onclick = () => { if(!ex.length) return toast('Nenhum extintor neste filtro.'); shareFile(`etiquetas_extintores_${today()}.html`, labelsSheetHTML(ex), 'text/html').then(()=>toast(`Folha com ${ex.length} etiqueta${ex.length===1?'':'s'} gerada. Abra no Chrome e imprima.`)); };

function rechargeReturnDialog(e){
  const d = document.createElement('dialog');
  d.innerHTML = `<form method="dialog" class="stack">
    <h2 style="margin-top:0">Retorno da recarga</h2>
    ${fld('Data da recarga', inp('date', today(), 'date', 'required'))}
    <label class="row"><input type="checkbox" name="hydro"> <span>Também foi feito o teste hidrostático</span></label>
    <p class="small muted">A próxima recarga será calculada para 12 meses depois, e o hidrostático para 5 anos.</p>
    <div class="actions"><button class="btn" value="cancel">Cancelar</button><button class="btn primary" value="ok">Registrar retorno</button></div>
  </form>`;
  document.body.appendChild(d); d.showModal();
  d.addEventListener('close', () => {
    if(d.returnValue === 'ok'){
      const fd = new FormData(d.querySelector('form')); const dt = fd.get('date') || today();
      Object.assign(e, {rechargeStatus:'', rechargeReturnedAt:nowISO(), lastRecharge:dt, nextRecharge:addMonths(dt,12)});
      if(fd.get('hydro')) Object.assign(e, {lastHydro:dt, nextHydro:addMonths(dt,60)});
      upsert('extinguishers', e); logHist('Retorno de recarga', e.asset, e.id); toast('Retorno registrado'); render();
    }
    d.remove();
  });
}

const EXT_TYPES = ['Pó químico ABC','Pó químico BC','Água pressurizada','CO2','Espuma mecânica','Classe K'];
VIEWS.extForm = (r) => {
  const isNew = !r.id;
  const e = isNew ? {...(r.prefill||{}), id:genId('EXT'), clientId:S.clients[0]?.id||'CLI-1', unitId:S.units[0]?.id||'', sectorId:'', locationId:'', type:'', capacity:'', fireClass:'ABC', asset:'', inmetro:'', owner:'', notes:'', lastRecharge:'', nextRecharge:'', lastHydro:'', nextHydro:'', x:null, y:null, qrCode:'', ...(r.prefill||{})} : {...byId('extinguishers', r.id)};
  const locs = (S.locations||[]).filter(l => l.sectorId===e.sectorId);
  return { title: isNew ? 'Novo extintor' : `Editar extintor nº ${e.asset}`, html:`
  <form id="f" autocomplete="off">
    <fieldset><legend>Identificação</legend>
      <div class="grid2">${fld('Número (patrimônio)', inp('asset', e.asset, 'text','required inputmode="numeric"'))}${fld('Selo Inmetro', inp('inmetro', e.inmetro))}</div>
      ${fld('Tipo', sel('type', e.type, EXT_TYPES))}
      <div class="grid2">${fld('Capacidade', inp('capacity', e.capacity, 'text','list="caps" placeholder="ex.: 6 kg"'))}${fld('Classe de fogo', sel('fireClass', e.fireClass, ['A','BC','ABC','K']))}</div>
      <datalist id="caps"><option>4 kg</option><option>6 kg</option><option>8 kg</option><option>10 L</option><option>12 kg</option><option>20 kg</option></datalist>
    </fieldset>

      ${fld('Unidade', sel('unitId', e.unitId, (S.units||[]).map(u=>({v:u.id,l:u.name}))))}
      ${fld('Setor', sel('sectorId', e.sectorId, locationOptions(e.unitId)))}
      ${fld('Local', sel('locationId', e.locationId, locs.map(l=>({v:l.id,l:l.name}))))}
      ${fld('Ou cadastre um novo local neste setor', inp('newLocation','', 'text','placeholder="Nome do novo local"'))}
    </fieldset>
    <fieldset><legend>Validades</legend>
      <div class="grid2">${fld('Última recarga', inp('lastRecharge', e.lastRecharge, 'date'))}${fld('Próxima recarga', inp('nextRecharge', e.nextRecharge, 'date'))}</div>
      <div class="grid2">${fld('Último hidrostático', inp('lastHydro', e.lastHydro, 'date'))}${fld('Próximo hidrostático', inp('nextHydro', e.nextHydro, 'date'))}</div>
      <p class="small muted" style="margin:0">Ao preencher a última data, a próxima é sugerida automaticamente (12 meses para recarga, 5 anos para hidrostático).</p>
    </fieldset>
    <fieldset><legend>Outros</legend>
      ${fld('Responsável', inp('owner', e.owner))}
      ${fld('Observações', ta('notes', e.notes))}
      ${fld('Código da etiqueta QR (vazio = usar o QR gerado pelo app)', inp('qrCode', e.qrCode||''))}
    </fieldset>
    <div class="sticky-save"><button class="btn primary full" type="submit">${isNew?'Cadastrar extintor':'Salvar alterações'}</button></div>
  </form>`, after(){
    const f = $('#f');
    f.unitId.onchange = () => { f.sectorId.innerHTML = '<option value="">—</option>'+locationOptions(f.unitId.value).map(o=>`<option value="${o.v}">${esc(o.l)}</option>`).join(''); f.locationId.innerHTML='<option value="">—</option>'; };
    f.sectorId.onchange = () => { f.locationId.innerHTML = '<option value="">—</option>'+(S.locations||[]).filter(l=>l.sectorId===f.sectorId.value).map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join(''); };
    f.lastRecharge.onchange = () => { if(f.lastRecharge.value) f.nextRecharge.value = addMonths(f.lastRecharge.value, 12); };
    f.lastHydro.onchange = () => { if(f.lastHydro.value) f.nextHydro.value = addMonths(f.lastHydro.value, 60); };
    f.onsubmit = ev => {
      ev.preventDefault();
      const fd = Object.fromEntries(new FormData(f));
      const asset = trim(fd.asset);
      const dup = (S.extinguishers||[]).find(x => x.id!==e.id && trim(x.asset)===asset && x.unitId===fd.unitId);
      if(dup && !confirmDo(`Já existe o extintor nº ${asset} nesta unidade. Salvar mesmo assim?`)) return;
      const qrc = trim(fd.qrCode);
      const qdup = qrc && (S.extinguishers||[]).find(x => x.id!==e.id && x.qrCode===qrc);
      if(qdup){ toast(`Esse QR code já está vinculado ao extintor nº ${qdup.asset}.`); return; }
      e.qrCode = qrc;
      ['asset','inmetro','type','capacity','fireClass','unitId','sectorId','locationId','lastRecharge','nextRecharge','lastHydro','nextHydro','owner','notes'].forEach(k => e[k] = k==='asset' ? asset : (fd[k] ?? ''));
      if(trim(fd.newLocation)){
        if(!fd.sectorId){ toast('Escolha o setor para cadastrar o novo local.'); return; }
        const loc = upsert('locations', {id:genId('LOC'), sectorId:fd.sectorId, name:trim(fd.newLocation)});
        e.locationId = loc.id;
      }
      upsert('extinguishers', e);
      logHist(isNew ? 'Cadastro' : 'Atualização', 'Extintor '+e.asset, e.id);
      toast(isNew ? 'Extintor cadastrado' : 'Alterações salvas');
      if(isNew){ stack.pop(); stack.push({v:'ext', id:e.id}); render(true); } else goBack();
    };
  }};
};

function labelPNG(e){

async function shareFile(name, content, mime, isDataUrl){

function findExtByCode(text){

  const ex = S.extinguishers || [];
  let e = ex.find(x => x.qrCode && trim(x.qrCode) === t); if(e) return e;
  const m = t.toUpperCase().match(/EXT-[A-Z0-9]+-[A-Z0-9]+/); if(m && (e = byId('extinguishers', m[0]))) return e;
  const cands = [t];
  try{ const j = JSON.parse(t); if(j && typeof j==='object'){ const id = j.id || j.extId; if(id && (e = byId('extinguishers', String(id)))) return e; ['asset','numero','number','patrimonio'].forEach(k => j[k] && cands.push(String(j[k]))); } }catch(err){}
  try{ const u = new URL(t); for(const k of ['id','ext','extId']){ const v = u.searchParams.get(k); if(v && (e = byId('extinguishers', v))) return e; } ['asset','numero','n','patrimonio'].forEach(k => { const v = u.searchParams.get(k); if(v) cands.push(v); }); }catch(err){}
  const dig = t.match(/^\D*(\d{1,6})\D*$/); if(dig) cands.push(dig[1]);

    e = ex.find(x => trim(x.asset) === trim(c)) || ex.find(x => /^\d+$/.test(c) && parseInt(x.asset,10) === parseInt(c,10)) || ex.find(x => x.inmetro && trim(x.inmetro) === trim(c));

}

async function getDecoder(){
  if(scan.decoder) return scan.decoder;
  if('BarcodeDetector' in window){
    try{ const f = await BarcodeDetector.getSupportedFormats(); if(f.includes('qr_code')){ const d = new BarcodeDetector({formats:['qr_code']}); scan.decoder = async v => { const r = await d.detect(v); return r[0]?.rawValue || null; }; return scan.decoder; } }catch(e){}

  const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d', {willReadFrequently:true});
  scan.decoder = async v => {
    const w = v.videoWidth, h = v.videoHeight; if(!w) return null;
    const k = Math.min(1, 720/Math.max(w,h)); canvas.width = Math.round(w*k); canvas.height = Math.round(h*k);

    <div class="list">${os.map(occCard).join('') || '<div class="empty">Nenhuma ocorrência neste filtro.</div>'}</div>
  `, after(){
    const qi = $('#q'); qi.oninput = () => { r.q = qi.value; const pos=qi.selectionStart; render(); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos); };
    document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { r.f = b.dataset.f; render(); });
    $('#newocc').onclick = () => go('occForm', {});
    document.querySelectorAll('[data-occ]').forEach(b => b.onclick = () => go('occ', {id:b.dataset.occ}));
  }};
};

function mediaHTML(media, removable){
  if(!media || !media.length) return '';
  return `<div class="photos">${media.map((m,ix) => {
    const ok = /^data:image\//.test(m.url||'');
    return `<figure>${ok ? `<img src="${m.url}" alt="${esc(m.name||'Foto')}">` : `<span>${esc(m.name||'Anexo')}<br>(arquivo da versão anterior)</span>`}${removable?`<button type="button" data-rmmedia="${ix}" aria-label="Remover foto">×</button>`:''}</figure>`;
  }).join('')}</div>`;
}
function occSummaryText(o){
  const a = o.accidentDetails||{};
  const local = [nameOf('units',o.unitId), nameOf('workSectors',o.workSectorId), o.exactLocation].filter(Boolean).join(' › ');
  const L = [`*${(S.company?.tradeName||S.company?.name||'SGTST Pocket').toUpperCase()}*`, `*${occLabel(o).toUpperCase()}*`, '',
    `📅 ${fmtDate(o.eventDate)}${o.eventTime?' às '+o.eventTime:''}`, `📍 ${local||'Local não informado'}`, `👤 ${o.personInvolved||'Não informado'}${a.role?' ('+a.role+')':''}`, `Status: ${o.status||'—'}`, '',
    `*O que aconteceu:*`, o.description||'—'];
  if(o.hadInjury) L.push('', `*Lesão:* ${o.hadInjury}${o.injuryDescription?' · '+o.injuryDescription:''}`);
  if(o.medicalCare==='SIM' || a.medicalPlaceType || a.medicalPlaceName) L.push(`*Atendimento médico:* ${[a.medicalPlaceType, a.medicalPlaceName].filter(Boolean).join(' · ') || 'sim'}${o.medicalCareDetails?' · '+o.medicalCareDetails:''}`);
  if(a.absenceDays) L.push(`*Dias de afastamento:* ${a.absenceDays}`);
  const whys = ['actWhy1','actWhy2','actWhy3','actWhy4','actWhy5'].map(k=>a[k]).filter(Boolean);
  if(whys.length){ L.push('', '*5 porquês:*'); whys.forEach((w,i)=>L.push(`${i+1}. ${w}`)); }
  if(a.correctiveActions) L.push('', '*Ações corretivas:*', a.correctiveActions);
  L.push('', '_Relatório completo em PDF anexo._');
  return L.join('\n');
}

async function getPDFLib(){
  if(window.PDFLib) return window.PDFLib;
  const src = document.getElementById('pdflib-src'); if(!src) throw new Error('biblioteca de PDF ausente');
  const sc = document.createElement('script'); sc.textContent = src.textContent; document.head.appendChild(sc);
  if(!window.PDFLib) throw new Error('biblioteca de PDF não carregou');
  return window.PDFLib;
}

async function sendOccPDF(o, btn){
  const old = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Gerando PDF…'; }
  try{
    const b64 = await occPDF(o), name = occFileName(o), text = occSummaryText(o), title = occLabel(o);
    const C = window.Capacitor;
    if(C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.Filesystem && C.Plugins.Share){
      const w = await C.Plugins.Filesystem.writeFile({path:name, directory:'CACHE', data:b64});
      await C.Plugins.Share.share({title, text, files:[w.uri], dialogTitle:'Enviar ocorrência'});
    }else{
      const blob = new Blob([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], {type:'application/pdf'});
      const file = typeof File==='function' ? new File([blob], name, {type:'application/pdf'}) : null;
      if(file && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({title, text, files:[file]}); }
      else{ const u = document.createElement('a'); u.href = URL.createObjectURL(blob); u.download = name; document.body.appendChild(u); u.click(); setTimeout(()=>{ URL.revokeObjectURL(u.href); u.remove(); }, 1500); toast('PDF baixado'); }
    }
    o.lastSentAt = nowISO(); upsert('occurrences', o);
  }catch(e){ if(!/cancel|abort/i.test(e.message||e.name||'')) toast('Não foi possível gerar o PDF: '+(e.message||e)); }
  finally{ if(btn){ btn.disabled = false; btn.innerHTML = old; } }
}

async function compressImage(file, max=1100, q=0.62){
  const url = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); });
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  const k = Math.min(1, max/Math.max(img.width,img.height));
  const c = document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const out = c.toDataURL('image/jpeg', q);
  return {name:file.name||'foto.jpg', type:'image/jpeg', size:Math.round(out.length*0.75), url:out};
}

const RISK_TYPES = ['Condição insegura','Ato inseguro / desvio','Quase acidente','Sugestão de melhoria'];
const RISK_CATS = ['Acidente (mecânico)','Físico','Químico','Biológico','Ergonômico'];
const RISK_STATUS = ['ABERTO','EM ANDAMENTO','CONCLUÍDO'];
const SEV = [[1,'1 · Insignificante'],[2,'2 · Leve'],[3,'3 · Moderada'],[4,'4 · Grave'],[5,'5 · Catastrófica']];
const PROB = [[1,'1 · Rara'],[2,'2 · Improvável'],[3,'3 · Possível'],[4,'4 · Provável'],[5,'5 · Quase certa']];
function riskLevel(s, p){
  const n = (Number(s)||0) * (Number(p)||0);
  if(!n) return {n:0, k:'n', label:'Não avaliado'};
  if(n >= 16) return {n, k:'crit', label:'Crítico'};
  if(n >= 10) return {n, k:'venc', label:'Alto'};
  if(n >= 5)  return {n, k:'warn', label:'Moderado'};
  return {n, k:'ok', label:'Baixo'};
}
const riskChip = x => { const l = riskLevel(x.severity, x.probability); return `<span class="chip c-${l.k==='crit'?'crit':l.k}">${esc(l.label)}${l.n?' · '+l.n:''}</span>`; };
const riskOpen = x => x.status !== 'CONCLUÍDO';
const riskLate = x => riskOpen(x) && x.deadline && daysUntil(x.deadline) < 0;
const riskHigh = x => riskLevel(x.severity, x.probability).n >= 10;
const RISK_NUM_RE = /^(\d{1,6})\/(\d{4})$/;
function nextRiskNumber(year){
  let max = 0; (S.riskRecords||[]).forEach(x => { const m = RISK_NUM_RE.exec(x.number||''); if(m && m[2]===String(year)) max = Math.max(max, +m[1]); });
  return String(max+1).padStart(3,'0')+'/'+year;

/* ---------- inteligência artificial (Google Gemini) ---------- */
const AI_MODELS = ['gemini-flash-latest','gemini-2.5-flash'];
function aiContext(){
  const setores = [...new Set([...(S.workSectors||[]).map(w => w.name), ...(CK.maquinas||[]).map(m => m.setor)].filter(Boolean))];
  const maqs = (CK.maquinas||[]).map(m => `${m.tag} ${m.nome}`).slice(0, 40);
  return `Empresa: ${S.company?.tradeName || S.company?.name || 'Tempermax'}, indústria de beneficiamento de vidro (corte, lapidação, furação, lavagem, têmpera, laminado, serigrafia, expedição), com ponte rolante, empilhadeiras, cavaletes de vidro e movimentação manual de chapas. Setores: ${setores.join(', ')}. Máquinas: ${maqs.join('; ')}.`;
}
const AI_SCHEMA = {type:'OBJECT', properties:{
  title:{type:'STRING'}, hazard:{type:'STRING'}, risk:{type:'STRING'}, category:{type:'STRING', enum:RISK_CATS},
  severity:{type:'INTEGER'}, probability:{type:'INTEGER'}, nrs:{type:'STRING'},
  immediateActions:{type:'STRING'}, correctiveActions:{type:'STRING'}, epiEpc:{type:'STRING'}, observations:{type:'STRING'}},
  required:['title','hazard','risk','category','severity','probability','nrs','immediateActions','correctiveActions','epiEpc']};
async function aiCall(parts, json){
  if(!P.aiKey) throw new Error('Cadastre a chave da IA em Mais › Inteligência artificial.');
  if(!navigator.onLine) throw new Error('Sem internet. A análise por IA precisa de conexão.');
  const models = [...new Set([P.aiModel, ...AI_MODELS].filter(Boolean))];
  let lastErr = null;
  for(const m of models){
    const body = {contents:[{role:'user', parts}], generationConfig:{temperature:0.3, ...(json ? {responseMimeType:'application/json', responseSchema:AI_SCHEMA} : {})}};
    let res;
    try{ res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, {method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':P.aiKey}, body:JSON.stringify(body)}); }
    catch(e){ throw new Error('Não foi possível falar com o Google. Verifique a internet.'); }
    const j = await res.json().catch(() => ({}));
    if(res.ok){
      const txt = (j.candidates?.[0]?.content?.parts||[]).map(p => p.text||'').join('');
      if(!txt) throw new Error('A IA não devolveu resposta (a imagem pode ter sido bloqueada). Tente outra foto.');
      return txt;
    }
    const msg = j.error?.message || ('erro '+res.status);
    if(res.status === 404 || /not found|not supported/i.test(msg)){ lastErr = new Error('Modelo indisponível: '+m); continue; }
    if(res.status === 400 && /API key/i.test(msg)) throw new Error('Chave da IA inválida. Confira em Mais › Inteligência artificial.');
    if(res.status === 403) throw new Error('A chave não tem permissão para usar a IA. Crie a chave de novo no AI Studio.');
    if(res.status === 429) throw new Error('Limite gratuito da IA atingido por agora. Tente de novo em alguns minutos.');
    throw new Error(msg);
  }
  throw lastErr || new Error('Nenhum modelo de IA disponível.');
}
async function aiAnalyzeRisk(x){
  const photos = (x.media||[]).filter(m => /^data:image\/(jpe?g|png|webp)/i.test(m.url||''));
  if(!photos.length && !trim(x.description)) throw new Error('Tire pelo menos uma foto ou escreva uma descrição.');
  const prompt = `Você é técnico de segurança do trabalho no Brasil. ${aiContext()}
Analise ${photos.length ? 'as fotos e ' : ''}o relato abaixo e identifique o principal risco à saúde e segurança.
Tipo de registro: ${x.type||'—'}. Setor: ${nameOf('workSectors',x.workSectorId) || '—'}. Local: ${x.location||'—'}.
Descrição de quem registrou: ${trim(x.description) || '(sem descrição)'}
Responda em português do Brasil, de forma objetiva e prática para o chão de fábrica:
- title: título curto (até 8 palavras)
- hazard: o perigo (fonte do dano)
- risk: o risco (o que pode acontecer com quem)
- category: categoria do risco segundo a NR-1 (uma das opções)
- severity e probability: de 1 a 5
- nrs: NRs relacionadas com os itens principais (ex.: NR-12 12.38; NR-11 11.1.3)
- immediateActions: o que fazer agora, em tópicos curtos separados por quebra de linha
- correctiveActions: ações corretivas definitivas, em tópicos curtos
- epiEpc: EPIs e EPCs indicados
- observations: o que não dá para afirmar só pela foto (se houver)
Se a foto não mostrar risco claro, diga isso no title e use severidade e probabilidade baixas.`;
  const parts = [{text:prompt}, ...photos.slice(0,4).map(m => ({inline_data:{mime_type:m.url.slice(5, m.url.indexOf(';')), data:m.url.split(',')[1]}}))];
  const txt = await aiCall(parts, true);
  let j; try{ j = JSON.parse(txt.replace(/```json|```/g,'').trim()); }catch(e){ throw new Error('A resposta da IA veio em formato inesperado. Tente de novo.'); }
  const clamp = v => Math.max(1, Math.min(5, parseInt(v,10)||1));
  return {title:trim(j.title), hazard:trim(j.hazard), risk:trim(j.risk), category:RISK_CATS.includes(j.category) ? j.category : RISK_CATS[0], severity:clamp(j.severity), probability:clamp(j.probability), nrs:trim(j.nrs), immediateActions:trim(j.immediateActions), correctiveActions:trim(j.correctiveActions), epiEpc:trim(j.epiEpc), aiNotes:trim(j.observations)};
}

function riskSummaryText(x){
  const lv = riskLevel(x.severity, x.probability);
  const L = [`*${(S.company?.tradeName||S.company?.name||'SGTST Pocket').toUpperCase()}*`, `*REGISTRO DE RISCO Nº ${x.number}*`, '',
    `⚠️ ${x.title||x.type}`, `📋 ${x.type}`, `📅 ${fmtDate(x.date)}${x.time?' às '+x.time:''}`, `📍 ${[nameOf('workSectors',x.workSectorId), x.location].filter(Boolean).join(' › ') || 'Local não informado'}`,
    `🔺 Nível de risco: *${lv.label}*${lv.n?' ('+lv.n+')':''}`, `Status: ${x.status}`];
  if(x.hazard) L.push('', `*Perigo:* ${x.hazard}`);
  if(x.risk) L.push(`*Risco:* ${x.risk}`);
  if(x.immediateActions) L.push('', '*Ações imediatas:*', x.immediateActions);
  if(x.responsible || x.deadline) L.push('', `*Responsável:* ${x.responsible||'—'}${x.deadline?' · prazo '+fmtDate(x.deadline):''}`);
  L.push('', '_Relatório completo em PDF anexo._');
  return L.join('\n');
}

async function riskPDF(x){

  const newPage = () => { pg = doc.addPage([W,H]); y = H - M; pg.drawRectangle({x:0, y:H-6, width:W, height:6, color:YEL}); if(doc.getPageCount() > 1){ pg.drawText(pdfSafe(`Registro de risco Nº ${x.number}${company?' · '+company:''}`), {x:M, y:H-28, size:8.5, font:F, color:MUT}); y = H - 46; } };
  const need = h => { if(y - h < M + 24) newPage(); };
  const section = t => { need(40); y -= 10; pg.drawRectangle({x:M, y:y-17, width:CW, height:20, color:DARK}); pg.drawRectangle({x:M, y:y-17, width:5, height:20, color:YEL}); pg.drawText(pdfSafe(t.toUpperCase()), {x:M+12, y:y-11.5, size:10, font:FB, color:rgb(1,1,1)}); y -= 26; };
  const LW = 150;

  const para = txt => { wrap(txt||'—', F, 10.5, CW-8).forEach(l => { need(15); pg.drawText(l, {x:M+4, y:y-11, size:10.5, font:F, color:INK}); y -= 14.5; }); y -= 4; };
  newPage();
  pg.drawRectangle({x:0, y:H-96, width:W, height:90, color:DARK});
  const OX = pdfOwlHeader(pg, await pdfOwl(doc), H, M, rgb);
  pg.drawText(pdfSafe(company || 'SGTST Pocket'), {x:M+OX, y:H-34, size:10, font:F, color:PALE});
  pg.drawText('REGISTRO DE RISCO', {x:M+OX, y:H-58, size:19, font:FB, color:rgb(1,1,1)});
  pg.drawText(pdfSafe(`${x.type||''}  ·  ${x.status||''}`), {x:M+OX, y:H-80, size:10, font:F, color:rgb(.85,.86,.92)});
  const nTxt = pdfSafe('Nº '+(x.number||'')), nw = FB.widthOfTextAtSize(nTxt, 20);
  pg.drawRectangle({x:W-M-nw-20, y:H-72, width:nw+20, height:32, color:YEL}); pg.drawText(nTxt, {x:W-M-nw-10, y:H-62, size:20, font:FB, color:rgb(1,1,1)});
  y = H - 112;
  /* faixa do nível de risco */
  const lv = riskLevel(x.severity, x.probability);
  const LC = {ok:rgb(0,.52,.25), warn:rgb(.95,.72,.02), venc:rgb(.78,.06,.18), crit:rgb(.45,0,.08), n:rgb(.6,.62,.65)}[lv.k];
  need(44); pg.drawRectangle({x:M, y:y-36, width:CW, height:36, color:LC});
  pg.drawText(pdfSafe(`NÍVEL DE RISCO: ${lv.label.toUpperCase()}${lv.n ? '  (severidade '+x.severity+' x probabilidade '+x.probability+' = '+lv.n+')' : ''}`), {x:M+12, y:y-23, size:12, font:FB, color: lv.k==='warn' ? INK : rgb(1,1,1)});
  y -= 46;
  section('Identificação');
  row('Título', x.title); row('Tipo', x.type); row('Data e hora', `${fmtDate(x.date)}${x.time?' às '+x.time:''}`);
  row('Unidade', nameOf('units',x.unitId)); row('Setor', nameOf('workSectors',x.workSectorId)); row('Local exato', x.location); row('Registrado por', x.reporter);
  if(trim(x.description)){ section('O que foi observado'); para(x.description); }
  section('Análise do risco');
  row('Perigo', x.hazard); row('Risco', x.risk); row('Categoria (NR-1)', x.category);
  row('Severidade', (SEV.find(s => s[0]==x.severity)||[,''])[1]); row('Probabilidade', (PROB.find(s => s[0]==x.probability)||[,''])[1]);
  row('NRs relacionadas', x.nrs);
  if(trim(x.immediateActions)){ section('Ações imediatas'); para(x.immediateActions); }
  if(trim(x.correctiveActions)){ section('Ações corretivas'); para(x.correctiveActions); }

  if(fotos.length){
    section(`Fotos (${fotos.length})`);
    const gap = 12, cw = (CW-gap)/2, chMax = 230;
    for(let i=0; i<fotos.length; i+=2){
      const imgs = [];
      for(const m of fotos.slice(i,i+2)){ try{ const bytes = Uint8Array.from(atob(m.url.split(',')[1]), c => c.charCodeAt(0)); imgs.push(/png/i.test(m.url.slice(0,20)) ? await doc.embedPng(bytes) : await doc.embedJpg(bytes)); }catch(e){} }
      if(!imgs.length) continue;
      const dims = imgs.map(im => im.scaleToFit(cw, chMax)), rh = Math.max(...dims.map(d => d.height));
      need(rh+10); imgs.forEach((im,j) => { const d = dims[j]; pg.drawImage(im, {x:M + j*(cw+gap) + (cw-d.width)/2, y:y-d.height, width:d.width, height:d.height}); }); y -= rh + 12;
    }
  }
  need(110); y -= 18;
  pg.drawText('ASSINATURAS', {x:M, y:y, size:9, font:FB, color:MUT}); y -= 58;
  const sw = (CW - 2*20)/3;
  ['Quem registrou','Responsável pela ação','Técnico de segurança'].forEach((t,i) => { const xx = M + i*(sw+20); pg.drawLine({start:{x:xx, y}, end:{x:xx+sw, y}, thickness:.8, color:INK}); pg.drawText(pdfSafe(t), {x:xx, y:y-12, size:8.5, font:F, color:MUT}); });
  const pages = doc.getPages(), gen = pdfSafe(`Gerado pelo SGTST Pocket ${VERSION} em ${new Date().toLocaleString('pt-BR')}`);
  pages.forEach((p,i) => { p.drawLine({start:{x:M, y:30}, end:{x:W-M, y:30}, thickness:.5, color:LINE}); p.drawText(gen, {x:M, y:18, size:7.5, font:F, color:MUT}); const pt = pdfSafe(`Página ${i+1} de ${pages.length}`); p.drawText(pt, {x:W-M-F.widthOfTextAtSize(pt,7.5), y:18, size:7.5, font:F, color:MUT}); });
  return await doc.saveAsBase64();
}
async function sendRiskPDF(x, btn){
  const old = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Gerando PDF…'; }
  try{
    const b64 = await riskPDF(x), title = 'Registro de risco Nº '+x.number, text = riskSummaryText(x);
    const name = `Risco_${String(x.number).replace('/','-')}_${trim(x.title).split(/\s+/).slice(0,3).join('_')}.pdf`.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]/g,'_');
    const C = window.Capacitor;
    if(C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.Filesystem && C.Plugins.Share){
      const w = await C.Plugins.Filesystem.writeFile({path:name, directory:'CACHE', data:b64});
      await C.Plugins.Share.share({title, text, files:[w.uri], dialogTitle:'Enviar registro de risco'});
    }else{
      const blob = new Blob([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], {type:'application/pdf'});
      const file = typeof File==='function' ? new File([blob], name, {type:'application/pdf'}) : null;
      if(file && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({title, text, files:[file]}); }
      else{ const u = document.createElement('a'); u.href = URL.createObjectURL(blob); u.download = name; document.body.appendChild(u); u.click(); setTimeout(() => { URL.revokeObjectURL(u.href); u.remove(); }, 1500); toast('PDF baixado'); }
    }
    x.lastSentAt = nowISO(); upsert('riskRecords', x);
  }catch(e){ if(!/cancel|abort/i.test(e.message||e.name||'')) toast('Não foi possível gerar o PDF: '+(e.message||e)); }
  finally{ if(btn){ btn.disabled = false; btn.innerHTML = old; } }
}

  {col:'workSectors', t:'Setores de trabalho (SST)',   ph:'Ex.: Produção Temperado', pre:'WRK', parent:'units',   pf:'unitId',   hint:'Usados em ocorrências, riscos e colaboradores.'},

function placeUsage(col, id){
  const n = (c, f) => (S[c]||[]).filter(x => x[f] === id).length;
  const parts = [];
  const add = (v, one, many) => { if(v) parts.push(`${v} ${v===1 ? one : many}`); };
  if(col==='units'){ add(n('workSectors','unitId') + n('sectors','unitId'), 'setor/área', 'setores/áreas'); add(n('extinguishers','unitId'), 'extintor', 'extintores'); add(n('occurrences','unitId'), 'ocorrência', 'ocorrências'); }
  if(col==='workSectors'){ add(n('occurrences','workSectorId'), 'ocorrência', 'ocorrências'); add(n('riskRecords','workSectorId'), 'risco', 'riscos'); add(n('collaborators','workSectorId'), 'colaborador', 'colaboradores'); }
  if(col==='sectors'){ add(n('extinguishers','sectorId'), 'extintor', 'extintores'); add(n('locations','sectorId'), 'local', 'locais'); }
  if(col==='locations'){ add(n('extinguishers','locationId'), 'extintor', 'extintores'); }
  return parts;
}
const placeChildren = (col, id) => col==='units' ? (S.workSectors||[]).filter(x => x.unitId===id).length + (S.sectors||[]).filter(x => x.unitId===id).length : col==='sectors' ? (S.locations||[]).filter(x => x.sectorId===id).length : 0;

/* =====================================================================
   CRUZ DA SEGURANÇA e placar de acidentes
   ===================================================================== */
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const ymLabel = ym => { const [y,m] = ym.split('-').map(Number); return `${MESES[m-1]} de ${y}`; };
const ymAdd = (ym, k) => { let [y,m] = ym.split('-').map(Number); m += k; while(m < 1){ m += 12; y--; } while(m > 12){ m -= 12; y++; } return `${y}-${String(m).padStart(2,'0')}`; };
const occDay = o => String(o.eventDate||'').slice(0,10);
/* acidente: com afastamento (dias perdidos/afastamento ou incapacitante/fatal) · sem afastamento (teve atendimento médico) · primeiros socorros */
function accClass(o){
  if(o.eventType !== 'ACIDENTE') return null;
  const a = o.accidentDetails || {}, cls = [].concat(a.classification||[]).join(' ');
  if((Number(a.absenceDays)||0) > 0 || (Number(a.lostDays)||0) > 0 || /Incapacitante(?! *não)|Fatal/i.test(cls.replace('Não incapacitante','')) || /3 a 15|Mais de 15|Permanente/.test(a.incapacity||'')) return 'com';
  if(o.medicalCare === 'SIM' || a.medicalPlaceType) return 'sem';
  return 'ps';
}
/* eventos do período: ocorrências + registros de risco (quase acidente, condição e ato inseguro) */
function safetyEvents(from, to, ws){
  const inWs = x => !ws || x.workSectorId === ws;
  const occ = (S.occurrences||[]).filter(o => inWs(o) && occDay(o) >= from && occDay(o) <= to);
  const rk = (S.riskRecords||[]).filter(x => inWs(x) && String(x.date||'') >= from && String(x.date||'') <= to);
  return {occ, rk};
}
function placar(from, to, ws){
  const {occ, rk} = safetyEvents(from, to, ws);
  const c = {com:0, sem:0, ps:0, quase:0, cond:0, ato:0};
  occ.forEach(o => { const k = accClass(o); if(k) c[k]++; else if(o.eventType === 'INCIDENTE') c.quase++; });
  rk.forEach(x => { if(x.type === 'Quase acidente') c.quase++; else if(x.type === 'Condição insegura') c.cond++; else if(/Ato inseguro/.test(x.type||'')) c.ato++; });
  c.acc = c.com + c.sem + c.ps; c.inc = c.quase + c.cond + c.ato; c.total = c.acc + c.inc;
  return c;
}
function dayStatus(ym, ws){
  const last = new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate(), {occ, rk} = safetyEvents(ym+'-01', ym+'-31', ws), M = {};
  for(let d = 1; d <= last; d++){ const iso = `${ym}-${String(d).padStart(2,'0')}`; M[d] = {iso, k: iso > today() ? 'fut' : 'ok', acc:0, inc:0}; }
  occ.forEach(o => { const d = +occDay(o).slice(8,10); if(!M[d]) return; if(o.eventType==='ACIDENTE') M[d].acc++; else M[d].inc++; });
  rk.forEach(x => { if(x.type !== 'Quase acidente') return; const d = +String(x.date).slice(8,10); if(M[d]) M[d].inc++; });
  Object.values(M).forEach(v => { if(v.acc) v.k = 'acc'; else if(v.inc) v.k = 'inc'; });
  return {M, last};
}
const CRUZ_POS = (() => { const P = {}; let d = 1;
  [[4,1],[4,2]].forEach(([c0,row]) => { for(let i=0;i<3;i++) P[d++] = [c0+i, row, 1]; });
  [3,4].forEach(row => { for(let i=0;i<9;i++) P[d++] = [1+i, row, 1]; });
  [5,6].forEach(row => { for(let i=0;i<3;i++) P[d++] = [4+i, row, 1]; });
  P[31] = [4, 7, 3]; return P; })();
function cruzHTML(ym, ws, opts={}){

    const tip = v.k==='fut' ? 'dia futuro' : v.acc ? `${v.acc} acidente${v.acc>1?'s':''}${v.inc?` e ${v.inc} incidente${v.inc>1?'s':''}`:''}` : v.inc ? `${v.inc} incidente${v.inc>1?'s':''}` : 'sem ocorrência';
    return `<div class="cz k-${v.k}${v.iso===t?' today':''}" style="grid-column:${c}/span ${span};grid-row:${row}" title="${d}/${ym.slice(5,7)}: ${tip}"><b>${d}</b>${v.acc+v.inc > 1 ? `<small>${v.acc+v.inc}</small>` : ''}</div>`;

    <div class="cruz" role="img" aria-label="Cruz da segurança de ${esc(ymLabel(ym))}: ${nOk} dias sem ocorrência, ${nInc} dias com incidente, ${nAcc} dias com acidente">${cells}</div>

function placarHTML(c, cap=true){
  const R = [['com','Com afastamento','p-com'],['sem','Sem afastamento','p-sem'],['ps','Primeiros socorros','p-ps'],['quase','Quase acidente','p-quase'],['cond','Condição insegura','p-cond'],['ato','Ato inseguro','p-ato'],['acc','Total de acidentes','p-tot'],['inc','Total de incidentes','p-tot'],['total','Total geral','p-gt']];

function diasSemAcidente(){ const d = (S.occurrences||[]).filter(o => o.eventType==='ACIDENTE').map(occDay).filter(Boolean).sort().pop(); return d ? Math.max(0, -daysUntil(d)) : null; }

const nf = n => Number(n||0).toLocaleString('pt-BR');

const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function periodFrom(p){ const d = new Date(today()+'T12:00:00'); if(p==='30d') d.setDate(d.getDate()-29); else if(p==='90d') d.setDate(d.getDate()-89); else if(p==='ano'){ d.setMonth(0); d.setDate(1); } else { d.setDate(1); d.setMonth(d.getMonth()-11); } return isoLocal(d); }

function dashData(p, ws, ym){

    rkTop:[...rkOpen].sort((a,b) => riskLevel(b.severity,b.probability).n - riskLevel(a.severity,a.probability).n || String(a.deadline||'9').localeCompare(String(b.deadline||'9'))).slice(0,6),
    exN:ex.length, exOk, exVenc:ex.filter(e => extStatus(e).k==='venc').length, exWarn:ex.filter(e => extStatus(e).k==='warn').length, exRec:ex.filter(e => extStatus(e).k==='rec').length, exInsp:ex.filter(e => inspectedThisMonth(e.id)).length,

function presSlides(){

  const cover = {cover:true, html:`<div class="cover"><img src="${OWL_PNG}" alt="Coruja da Tempermax"><h1>${esc(S.company?.tradeName || S.company?.name || 'SGTST Pocket')}</h1><p class="what">Segurança e saúde no trabalho${dd.wsName ? ' · '+esc(dd.wsName) : ''}</p><p class="per">${esc(dd.periodName)}: ${esc(dd.rangeLabel)}<br>Dados de ${new Date().toLocaleString('pt-BR',{dateStyle:'long', timeStyle:'short'})}</p></div>`};
  return [cover, ...SS];
}
function drawPres(){
  if(!PRES) return;
  const sl = presSlides(); PRES.n = sl.length; PRES.i = Math.max(0, Math.min(PRES.i, sl.length-1));
  const x = sl[PRES.i];
  PRES.el.innerHTML = `<div class="stripe"></div>
    <div class="stage"><div class="slide" ${PRES.anim ? '' : 'style="animation:none"'}>${x.cover ? x.html : `<h2 class="st">${esc(x.t)}</h2><p class="sub">${esc(x.sub)}</p><div class="body">${x.body}</div>`}</div></div>
    <div class="foot">
      <button data-pa="close" aria-label="Fechar apresentação"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button data-pa="prev" aria-label="Slide anterior" ${PRES.i===0?'disabled':''}><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="prog" aria-hidden="true">${sl.map((_,k) => `<i class="${k===PRES.i?'on':k<PRES.i?'done':''}"></i>`).join('')}</div>
      <span class="count" aria-live="polite">${PRES.i+1} / ${sl.length}</span>
      <button data-pa="next" aria-label="Próximo slide"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button data-pa="auto" aria-pressed="${!!PRES.timer}" title="Passar sozinho a cada 12 segundos"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg><span>Auto</span></button>
    </div>`;
  PRES.anim = false;
  PRES.el.querySelectorAll('[data-pa]').forEach(b => b.onclick = () => { const a = b.dataset.pa; if(a==='close') closePres(); else if(a==='prev') presGo(-1); else if(a==='next') presGo(1); else presAuto(); });
  PRES.el.querySelectorAll('[data-cm]').forEach(b => b.onclick = () => { PRES.r.ym = ymAdd(PRES.r.ym || today().slice(0,7), +b.dataset.cm); drawPres(); });
}
function presGo(d){ if(!PRES) return; const n = PRES.n || 1; PRES.i = PRES.timer ? (PRES.i + d + n) % n : Math.max(0, Math.min(n-1, PRES.i + d)); PRES.anim = true; drawPres(); }
function presAuto(){ if(!PRES) return; if(PRES.timer){ clearInterval(PRES.timer); PRES.timer = null; } else PRES.timer = setInterval(() => presGo(1), 12000); drawPres(); }
function presKey(ev){
  if(!PRES) return;
  if(['ArrowRight','PageDown',' ','Enter'].includes(ev.key)){ ev.preventDefault(); presGo(1); }
  else if(['ArrowLeft','PageUp','Backspace'].includes(ev.key)){ ev.preventDefault(); presGo(-1); }
  else if(ev.key==='Home'){ PRES.i = 0; PRES.anim = true; drawPres(); }
  else if(ev.key==='Escape' && !document.fullscreenElement) closePres();
  else if(ev.key==='p' || ev.key==='P') presAuto();
}
function openPres(r){
  if(PRES) return;
  const el = document.createElement('div'); el.className = 'pres'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label','Apresentação de indicadores de segurança');
  document.body.appendChild(el);
  PRES = {el, r, i:0, n:1, timer:null, anim:true};
  history.pushState({pres:1}, '');
  drawPres();
  document.addEventListener('keydown', presKey);
  let x0 = null, y0 = null;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e => { if(x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.3) presGo(dx < 0 ? 1 : -1); x0 = null; }, {passive:true});
  try{ const de = document.documentElement; if(de.requestFullscreen && !document.fullscreenElement) de.requestFullscreen().then(() => { try{ screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} }).catch(()=>{}); }catch(e){}
}
function closePres(fromPop){
  if(!PRES) return;
  if(!fromPop){ history.back(); return; }
  if(PRES.timer) clearInterval(PRES.timer);
  PRES.el.remove(); PRES = null;
  document.removeEventListener('keydown', presKey);
  try{ screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); }catch(e){}
  try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }catch(e){}
}

const COST_FIELDS = [['medical','Atendimento médico / hospitalar'],['meds','Medicamentos e exames'],['transport','Transporte / remoção'],['material','Danos materiais e equipamentos'],['production','Perda de produção / retrabalho'],['other','Outros custos']];

function costData(from, to, ws, months){
  const acc = (S.occurrences||[]).filter(o => o.eventType==='ACIDENTE' && (!ws || o.workSectorId===ws));
  const inPer = acc.filter(o => occDay(o) >= from && occDay(o) <= to);
  let total = 0, direct = 0, daysCost = 0, days = 0; const people = {}, bySec = {};
  inPer.forEach(o => { const k = occCost(o); total += k.total; direct += k.direct; daysCost += k.daysCost; days += k.days;
    const n = trim(o.personInvolved) || 'Não informado', p = people[n] = people[n] || {name:n, sector:nameOf('workSectors', o.workSectorId), n:0, days:0, cost:0};
    p.n++; p.days += k.days; p.cost += k.total; const sn = nameOf('workSectors', o.workSectorId) || 'Sem setor'; bySec[sn] = (bySec[sn]||0) + k.total; });
  const mc = months.map(m => ({...m, cost:0})); acc.forEach(o => { const m = mc.find(x => x.key === occDay(o).slice(0,7)); if(m) m.cost += occCost(o).total; });
  const hc = headcount(), noCost = inPer.filter(o => !occCost(o).total).length;
  return {total, direct, daysCost, days, n:inPer.length, hc, perEmp: hc ? total/hc : 0, perAcc: inPer.length ? total/inPer.length : 0, people:Object.values(people).sort((a,b) => b.cost - a.cost || b.days - a.days), bySec:toList(bySec), months:mc, noCost, dayCost:Number(costCfg().dayCost)||0};
}
