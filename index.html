async function exportBackup(){
  await saveNow();
  const name = `SGTST_Pocket_backup_${today()}.json`;
  await shareFile(name, JSON.stringify(S, null, 2), 'application/json');
}
$('#importfile').addEventListener('change', async ev => {
  const file = ev.target.files[0]; ev.target.value = '';
  if(!file) return;
  let data;
  try{ data = JSON.parse(await file.text()); }catch(e){ toast('Arquivo inválido: não é um backup JSON.'); return; }
  if(!data || typeof data!=='object' || (!data.schemaVersion && !data.extinguishers)){ toast('Esse arquivo não parece um backup do SGTST Pocket.'); return; }
  if(S && (S.extinguishers.length || S.occurrences.length) && !confirmDo(`Importar este backup?\n\nRegistros iguais serão atualizados pela versão mais recente e registros novos serão adicionados. Nada será apagado.`)) return;
  data = normalize(data);
  if(!S){ S = data; setTimeout(() => { if(Cloud.user && Cloud.waiting) Cloud.start(); }, 0); }
  else {
    Object.keys(data).forEach(k => {
      if(k==='updatedAt') return;
      if(Array.isArray(data[k])){
        const arr = S[k] || (S[k]=[]);
        data[k].forEach(it => { const i = arr.findIndex(x=>x.id===it.id); const ts = x => x?.updatedAt||x?.createdAt||'';
          if(i<0) arr.push(it); else if(ts(it) >= ts(arr[i])) arr[i] = it; });
      } else if(S[k]==null || (typeof data[k]==='object' && !Array.isArray(data[k]))) S[k] = (typeof data[k]==='object' && data[k] && typeof S[k]==='object') ? {...S[k], ...data[k]} : data[k];
    });
  }
  const t = nowISO();
  Object.keys(S).forEach(k => { if(!Array.isArray(S[k]) && k!=='updatedAt') SY.metaTs[k] = SY.metaTs[k] || t; });
  ensureOccNumbers();
  allLocalKeys().forEach(k => SY.dirty[k] = (SY.dirty[k]||0)+1);
  await saveNow(); Cloud.scheduleFlush();
  toast(`Backup importado: ${S.extinguishers.length} extintores, ${S.occurrences.length} ocorrências`);
  stack = [{v:'home'}]; render(true);
});

/* ================= NUVEM (Firebase) ================= */
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('falha ao carregar '+src)); document.head.appendChild(s); }); }
function parseFirebaseConfig(txt){
  txt = String(txt||'');
  const m = txt.match(/\{[\s\S]*\}/); if(!m) throw new Error('Não encontrei a configuração. Cole o trecho que começa com { apiKey: … }.');
  let j = m[0].replace(/\/\/.*$/gm,'').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}');
  const cfg = JSON.parse(j);
  if(!cfg.apiKey || !cfg.projectId) throw new Error('A configuração precisa ter apiKey e projectId.');
  return cfg;
}
const AUTH_ERR = {'auth/invalid-email':'E-mail inválido.','auth/user-not-found':'Conta não encontrada.','auth/wrong-password':'Senha incorreta.','auth/invalid-credential':'E-mail ou senha incorretos.','auth/email-already-in-use':'Já existe uma conta com esse e-mail. Use "Entrar".','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/network-request-failed':'Sem conexão com a internet.','auth/operation-not-allowed':'Ative o login por e-mail e senha no console do Firebase (Authentication › Sign-in method).','auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos.'};
const authMsg = e => AUTH_ERR[e.code] || e.message || String(e);

const Cloud = {
  ready:false, user:null, status:'off', msg:'', unsub:null, timer:null, flushing:false, lastSync:null,
  async init(){
    if(!P.firebaseConfig){ this.status='off'; updateSyncChip(); return; }
    this.status='sync'; updateSyncChip();
    try{
      const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VER}/`;
      await loadScript(base+'firebase-app-compat.js');
      await loadScript(base+'firebase-auth-compat.js');
      await loadScript(base+'firebase-firestore-compat.js');
    }catch(e){ this.status='offline'; this.msg='Sem internet para iniciar a sincronização. O app continua funcionando no aparelho.'; updateSyncChip(); setTimeout(()=>this.init(), 30000); return; }
    try{
      if(!firebase.apps.length) firebase.initializeApp(P.firebaseConfig);
      this.auth = firebase.auth(); this.db = firebase.firestore();
      this.ready = true;
      this.auth.onAuthStateChanged(u => { this.user = u; if(u) this.start(); else { this.stop(); this.status='login'; } updateSyncChip(); if(['cloud','more'].includes(cur().v)) render(); else softRender(); });
    }catch(e){ this.status='erro'; this.msg='Configuração do Firebase inválida: '+e.message; updateSyncChip(); }
  },
  items(){ return this.db.collection('workspaces').doc(this.user.uid).collection('items'); },
  start(){
    if(!S){ this.waiting = true; return; }   /* ainda na tela de boas-vindas: começa quando os dados locais existirem */
    this.waiting = false;
    this.stop();
    if(SY.uid !== this.user.uid){ SY.uid = this.user.uid; allLocalKeys().forEach(k => SY.dirty[k] = (SY.dirty[k]||0)+1); }
    this.status='sync'; updateSyncChip();
    let first = true;
    this.unsub = this.items().onSnapshot(snap => {
      let changed = false;
      snap.docChanges().forEach(ch => { if(ch.type!=='removed' && applyRemote(ch.doc.id, ch.doc.data())) changed = true; });
      if(first){ first = false; const remote = new Set(snap.docs.map(d=>d.id)); allLocalKeys().forEach(k => { if(!remote.has(k)) SY.dirty[k] = (SY.dirty[k]||0)+1; }); }
      scheduleSave();
      if(changed) softRender();
      if(!this.flushing){ this.status='ok'; this.lastSync=new Date(); }
      updateSyncChip(); this.flush();
    }, err => { this.status='erro'; this.msg = /permission/i.test(err.message) ? 'O Firebase recusou o acesso. Confira as regras do Firestore (veja o LEIA-ME).' : err.message; updateSyncChip(); });
  },
  stop(){ if(this.unsub){ this.unsub(); this.unsub=null; } },
  scheduleFlush(){ clearTimeout(this.timer); this.timer = setTimeout(()=>this.flush(), 1500); },
  async flush(){
    if(!this.user || this.flushing) return;
    const keys = Object.keys(SY.dirty); if(!keys.length) return;
    if(!navigator.onLine){ this.status='offline'; updateSyncChip(); return; }
    this.flushing = true; this.status='sync'; updateSyncChip();
    try{
      let batch = this.db.batch(), n = 0, bytes = 0, pending = [];
      const commit = async () => { if(!n) return; await batch.commit(); pending.forEach(([k,v]) => { if(SY.dirty[k]===v) delete SY.dirty[k]; }); batch = this.db.batch(); n=0; bytes=0; pending=[]; };
      for(const k of keys){
        const d = docFor(k); const sz = (d.json||'').length + 200;
        if(n >= 400 || bytes + sz > 5_000_000) await commit();
        batch.set(this.items().doc(k), d); n++; bytes += sz; pending.push([k, SY.dirty[k]]);
      }
      await commit();
      this.status='ok'; this.lastSync=new Date(); this.msg='';
      scheduleSave();
    }catch(e){ this.status='erro'; this.msg = /permission/i.test(e.message) ? 'O Firebase recusou a gravação. Confira as regras do Firestore (veja o LEIA-ME).' : 'Erro ao enviar: '+e.message; }
    finally{ this.flushing=false; updateSyncChip(); if(Object.keys(SY.dirty).length && this.status==='ok') this.scheduleFlush(); }
  }
};
function localTs(k){
  const [col,id] = splitKey(k);
  if(col==='$meta') return S[id]!==undefined ? (SY.metaTs[id]||'') : (SY.tomb[k]||'');
  const it = (S[col]||[]).find(x=>x.id===id);
  return it ? (it.updatedAt||it.createdAt||'') : (SY.tomb[k]||'');
}
function docFor(k){
  const [col,id] = splitKey(k);
  if(col==='$meta'){ if(!SY.metaTs[id]) SY.metaTs[id]=nowISO(); return {col, id, ts:SY.metaTs[id], deleted:S[id]===undefined, json:S[id]===undefined?'':JSON.stringify(S[id])}; }
  const it = (S[col]||[]).find(x=>x.id===id);
  if(it) return {col, id, ts:it.updatedAt||it.createdAt||'', deleted:false, json:JSON.stringify(it)};
  return {col, id, ts:SY.tomb[k]||nowISO(), deleted:true, json:''};
}
function applyRemote(k, d){
  const [col,id] = splitKey(k);
  const lts = localTs(k), rts = d.ts||'';
  const hasLocal = col==='$meta' ? S[id]!==undefined : (S[col]||[]).some(x=>x.id===id);
  if(rts < lts){ SY.dirty[k] = (SY.dirty[k]||0)+1; return false; }      // local é mais novo: reenviar
  if(rts === lts && (hasLocal || SY.tomb[k])) return false;              // iguais
  delete SY.dirty[k];
  if(d.deleted){
    SY.tomb[k] = rts;
    if(!hasLocal) return false;
    if(col==='$meta') delete S[id]; else S[col] = S[col].filter(x=>x.id!==id);
    return true;
  }
  let data; try{ data = JSON.parse(d.json); }catch(e){ return false; }
  delete SY.tomb[k];
  if(col==='$meta'){ S[id] = data; SY.metaTs[id] = rts; return true; }
  const arr = S[col] || (S[col]=[]);
  const i = arr.findIndex(x=>x.id===id);
  if(i>=0) arr[i] = data; else arr.push(data);
  return true;
}
function cloudStatusText(){
  if(!P.firebaseConfig) return 'Os dados estão só neste aparelho. Configure a sincronização para usar em outros aparelhos e ter cópia na nuvem.';
  if(Cloud.status==='login' || (Cloud.ready && !Cloud.user)) return 'Firebase configurado. Entre com sua conta para sincronizar.';
  if(Cloud.status==='erro') return 'Problema na sincronização: '+esc(Cloud.msg);
  if(Cloud.status==='offline') return esc(Cloud.msg || 'Sem internet. As alterações ficam guardadas e serão enviadas quando a conexão voltar.');
  if(Cloud.user) return `Conectado como <b>${esc(Cloud.user.email)}</b>.${Cloud.lastSync?' Última sincronização: '+Cloud.lastSync.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'.':''}`;
  return 'Iniciando sincronização…';
}
function updateSyncChip(){
  const b = $('#sync'); if(!b) return;
  let s = Cloud.status, t = 'Local';
  if(!P.firebaseConfig){ s='off'; t='Só no aparelho'; }
  else if(s==='login'){ s='offline'; t='Entrar'; }
  else if(s==='sync') t='Sincronizando';
  else if(s==='ok') t = Object.keys(SY.dirty).length ? 'Pendente' : 'Sincronizado';
  else if(s==='offline') t='Offline';
  else if(s==='erro') t='Erro';
  b.dataset.s = s; b.querySelector('span').textContent = t;
}
window.addEventListener('online', () => { if(Cloud.user){ Cloud.status='ok'; Cloud.flush(); } else if(P.firebaseConfig && !Cloud.ready) Cloud.init(); updateSyncChip(); });
window.addEventListener('offline', () => { if(P.firebaseConfig){ Cloud.status='offline'; Cloud.msg=''; updateSyncChip(); } });

VIEWS.cloud = () => {
  const cfgTxt = P.firebaseConfig ? JSON.stringify(P.firebaseConfig, null, 2) : '';
  return { title:'Sincronização', html:`
    <div class="panel stack"><p style="margin:0">${cloudStatusText()}</p>
      ${Cloud.user ? `<div class="actions"><button class="btn primary" id="now">Sincronizar agora</button><button class="btn" id="out">Sair da conta</button></div>` : ''}
    </div>
    ${P.firebaseConfig && Cloud.ready && !Cloud.user ? `
    <h2>Entrar</h2>
    <form id="login" class="panel">
      ${fld('E-mail', inp('email','', 'email','required autocomplete="username"'))}
      ${fld('Senha', inp('password','', 'password','required minlength="6" autocomplete="current-password"'))}
      <div class="actions"><button class="btn primary" type="submit" value="in">Entrar</button><button class="btn" type="button" id="signup">Criar conta</button></div>
      <p class="small muted">Use a mesma conta em todos os aparelhos para ver os mesmos dados.</p>
    </form>` : ''}
    <h2>Projeto Firebase</h2>
    <form id="cfg" class="panel">
      ${fld('Configuração do app web (copie do console do Firebase)', `<textarea name="cfg" style="min-height:150px;font-family:ui-monospace,monospace;font-size:13px" placeholder="{ apiKey: &quot;…&quot;, authDomain: &quot;…&quot;, projectId: &quot;…&quot;, … }">${esc(cfgTxt)}</textarea>`)}
      <div class="actions"><button class="btn primary" type="submit">Salvar configuração</button>${P.firebaseConfig?'<button class="btn danger" type="button" id="clearcfg">Desligar sincronização</button>':''}</div>
      <p class="small muted">No console do Firebase: Configurações do projeto › Seus apps › app da Web › Configuração do SDK. O passo a passo completo está no arquivo LEIA-ME do projeto.</p>
    </form>
  `, after(){
    $('#cfg').onsubmit = ev => {
      ev.preventDefault();
      try{ const cfg = parseFirebaseConfig(new FormData(ev.target).get('cfg')); P.firebaseConfig = cfg; savePrefs(); toast('Configuração salva. Reiniciando…'); setTimeout(()=>location.reload(), 700); }
      catch(e){ toast(e.message); }
    };
    $('#clearcfg') && ($('#clearcfg').onclick = () => { if(confirmDo('Desligar a sincronização neste aparelho? Os dados continuam aqui.')){ P.firebaseConfig = null; savePrefs(); setTimeout(()=>location.reload(), 300); } });
    $('#login') && ($('#login').onsubmit = async ev => {
      ev.preventDefault(); const fd = new FormData(ev.target);
      try{ await Cloud.auth.signInWithEmailAndPassword(trim(fd.get('email')), fd.get('password')); toast('Conectado'); render(); }catch(e){ toast(authMsg(e)); }
    });
    $('#signup') && ($('#signup').onclick = async () => {
      const f = $('#login'); if(!f.reportValidity()) return; const fd = new FormData(f);
      try{ await Cloud.auth.createUserWithEmailAndPassword(trim(fd.get('email')), fd.get('password')); toast('Conta criada e conectada'); render(); }catch(e){ toast(authMsg(e)); }
    });
    $('#now') && ($('#now').onclick = async () => { allLocalKeys().forEach(k=>SY.dirty[k]=(SY.dirty[k]||0)+1); await Cloud.flush(); toast(Cloud.status==='ok'?'Tudo sincronizado':'Não foi possível sincronizar agora'); render(); });
    $('#out') && ($('#out').onclick = async () => { if(confirmDo('Sair da conta? Os dados continuam neste aparelho.')){ await Cloud.auth.signOut(); render(); } });
  }};
};

const CK_TPL = id => CK.modelos.find(m => m.id === id);
const MACH_TIPOS = {corte:'Mesa de corte e destaque', lapidacao:'Lapidação', furacao:'Furação', lavadora:'Lavadora', cnc:'CNC', laminacao:'Linha de laminação', autoclave:'Autoclave (vaso de pressão)', forno:'Forno de têmpera', serigrafia:'Serigrafia', compressor:'Compressor de ar', oficina:'Oficina de manutenção'};
const CK_ANS = [['C','C','ok'],['NC','NC','nc'],['NA','N/A','na']];
const ckIcon = nr => {
  const c = nr==='PT' ? '#0b5cad' : nr==='NR-12' ? '#c8102e' : '#f2b705';
  const t = nr==='PT' ? 'PT' : nr.replace('NR-','');
  return `<svg class="occico" viewBox="0 0 48 48" aria-hidden="true" style="stroke:none"><rect x="6" y="4" width="36" height="42" rx="5" style="fill:${c}"/><rect x="11" y="10" width="26" height="31" rx="2" style="fill:#fff"/><text x="24" y="30" text-anchor="middle" style="fill:#1a1c1e;font:800 ${t.length>2?9:12}px system-ui,Roboto,sans-serif">${t}</text></svg>`;
};
const ckLabel = c => `${CK_TPL(c.tpl)?.titulo || c.title || 'Checklist'}`;
const ckWhat = c => {
  const f = c.fields || {};
  if(c.machineId){ const m = byId('machines', c.machineId); return m ? `${m.tag} · ${m.name}` : (f.maquinaNome||''); }
  if(c.tpl==='pt') return f.servico || f.local || '';
  return f.equip || f.area || f.placa || f.local || '';
};
function ckVisibleSections(tpl, c){
  const m = c.machineId ? byId('machines', c.machineId) : null;
  const tipos = (c.fields||{}).tipos || [];
  return tpl.secoes.filter(s => {
    if(s.tipo) return m && m.tipo === s.tipo;
    if(s.tipoTrabalho) return tipos.includes(s.tipoTrabalho);
    if(s.encerramento) return c.status === 'ENCERRADA';
    return true;
  });
}
function ckEval(tpl, c){
  const secs = ckVisibleSections(tpl, c).filter(s => !s.encerramento);
  const items = secs.flatMap(s => s.itens);
  const nc = items.filter(i => c.answers?.[i.id] === 'NC');
  const crit = nc.filter(i => i.crit);
  return {items, nc, crit, result: crit.length ? 'REPROVADO' : nc.length ? 'COM PENDÊNCIAS' : 'CONFORME'};
}
function ckChip(c){
  if(c.tpl === 'pt'){
    if(c.status === 'ENCERRADA') return '<span class="chip c-n">Encerrada</span>';
    if(c.status === 'CANCELADA') return '<span class="chip c-n">Cancelada</span>';
    if(c.status === 'NÃO LIBERADA') return '<span class="chip c-venc">Não liberada</span>';
    if(ptExpired(c)) return '<span class="chip c-warn">Vencida, encerre</span>';
    return '<span class="chip c-ok">Liberada</span>';
  }
  return c.result === 'REPROVADO' ? '<span class="chip c-venc">Não liberado</span>' : c.result === 'COM PENDÊNCIAS' ? '<span class="chip c-warn">Com pendências</span>' : '<span class="chip c-ok">Conforme</span>';
}
const ptExpired = c => c.tpl==='pt' && c.status==='LIBERADA' && c.fields?.validade && new Date(c.fields.validade) < new Date();
const ptOpen = c => c.tpl==='pt' && c.status==='LIBERADA';
function lastMachCheck(mid){ return (S.checklists||[]).filter(c => c.machineId===mid && c.tpl==='nr12-maquina').sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]; }
function machStatus(m){
  const l = lastMachCheck(m.id);
  if(!l) return {k:'warn', label:'Nunca inspecionada'};
  if(l.result === 'REPROVADO') return {k:'venc', label:'Reprovada em '+fmtDate(l.date)};
  const d = -daysUntil(l.date.slice(0,10));
  if(d > 31) return {k:'warn', label:`Inspeção vencida (${d} dias)`};
  if(l.result === 'COM PENDÊNCIAS') return {k:'warn', label:'Com pendências'};
  return {k:'ok', label:'Inspecionada em '+fmtDate(l.date)};
}
const sortTag = (a,b) => String(a.tag||'').localeCompare(String(b.tag||''), 'pt-BR', {numeric:true});
const machLabel = m => `${m.tag} · ${m.name}`;
function peopleList(){ return (S.collaborators||[]).filter(c=>c.active!==false && c.name).map(c=>`<option value="${esc(c.name)}">`).join(''); }

function ckCard(c){
  return `<button class="card" data-ck="${c.id}">${ckIcon(c.nr||CK_TPL(c.tpl)?.nr||'')}<div class="grow">
    <div class="row"><span class="title grow">${esc(ckLabel(c))}</span>${ckChip(c)}</div>
    <div class="sub">${esc(ckWhat(c)||'—')} · ${fmtDateTime(c.date)}</div>
    <div class="sub">${esc(c.responsible||'')}${c.ncCount?` · ${c.ncCount} ${c.ncCount===1?'item':'itens'} não conforme${c.ncCount===1?'':'s'}`:''}</div></div></button>`;
}

  const hoje = all.filter(c => (c.date||'').slice(0,10) === today()).length;
  let list = all;
  if(f==='rep') list = all.filter(c => c.tpl==='pt' ? c.status==='NÃO LIBERADA' : c.result==='REPROVADO');
  if(f==='pt') list = all.filter(c => c.tpl==='pt');
  if(f==='nr11') list = all.filter(c => (CK_TPL(c.tpl)?.nr)==='NR-11');
  if(f==='nr12') list = all.filter(c => c.tpl==='nr12-maquina');
  const groups = [['NR-11','Movimentação e armazenagem (NR-11)'],['NR-12','Máquinas (NR-12)'],['PT','Permissão de Trabalho']];
  return { title:'Checklists', html:`
    <button class="btn primary scanbig" id="mscan" style="margin-bottom:12px">${ICON.qr} Ler QR code da máquina</button>
    <div class="tiles">
      <button class="tile blue" data-f="pt"><b>${pts.length}</b><span>PT${pts.length===1?'':'s'} aberta${pts.length===1?'':'s'}</span></button>
      <button class="tile red" data-f="rep"><b>${repr.length}</b><span>Reprovados em 30 dias</span></button>
      <button class="tile amber" id="tmach"><b>${mDue}</b><span>Máquinas a inspecionar</span></button>
      <button class="tile gray" data-f="all"><b>${hoje}</b><span>Checklists hoje</span></button>
    </div>
    ${pts.length ? `<h2>Permissões de trabalho abertas</h2><div class="list">${pts.map(ckCard).join('')}</div>` : ''}
    <h2>Novo checklist</h2>
    ${groups.map(([nr,t]) => `<details class="sec" open><summary>${esc(t)}</summary><div class="in"><div class="list" style="margin-bottom:12px">
      ${CK.modelos.filter(m=>m.nr===nr).map(m => `<button class="card" data-tpl="${m.id}">${ckIcon(m.nr)}<div class="grow"><div class="title">${esc(m.titulo)}</div><div class="sub">${esc(m.frequencia)} · ${esc((m.setores||[]).join(', '))}</div></div></button>`).join('')}
      ${nr==='NR-12' ? `<button class="btn full" id="machs">Máquinas cadastradas (${ms.length})</button>` : ''}
    </div></div></details>`).join('')}
    <h2>Registros</h2>
    <div class="filters" role="group" aria-label="Filtros">${[['all','Todos'],['rep','Reprovados'],['nr11','NR-11'],['nr12','NR-12'],['pt','PT']].map(([k,l])=>`<button data-f="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div>
    <div class="list">${list.slice(0,40).map(ckCard).join('') || '<div class="empty">Nenhum checklist neste filtro.</div>'}</div>
  `, after(){
    $('#mscan').onclick = () => go('mscan');
    $('#tmach').onclick = () => go('machs', {f:'due'});
    $('#machs').onclick = () => go('machs');
    document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { r.f = b.dataset.f; render(); });
    document.querySelectorAll('[data-tpl]').forEach(b => b.onclick = () => {
      if(b.dataset.tpl === 'nr12-maquina' && !(S.machines||[]).length){ toast('Cadastre as máquinas primeiro.'); return go('machs'); }
      go('ckForm', {tpl:b.dataset.tpl});
    });
    bindCkCards();
  }};
};

function ckFieldHTML(fd, c){
  const v = (c.fields||{})[fd.id] ?? '', n = 'f.'+fd.id;
  if(fd.tipo === 'maquina'){
    const opts = [...(S.machines||[])].sort(sortTag).map(m => ({v:m.id, l:machLabel(m)}));
    return fld(fd.label, sel('machineId', c.machineId||'', opts).replace('<select','<select required'));
  }
  if(fd.tipo === 'opcao') return fld(fd.label, sel(n, v, fd.opcoes));
  if(fd.tipo === 'numero') return fld(fd.label, inp(n, v, 'text', 'inputmode="decimal"'));
  if(fd.tipo === 'textolongo') return fld(fd.label, ta(n, v).replace('<textarea', fd.id==='servico'?'<textarea required':'<textarea'));
  if(fd.tipo === 'datahora') return fld(fd.label, inp(n, v, 'datetime-local', fd.id==='validade'?'required':''));
  if(fd.tipo === 'colaborador') return fld(fd.label, inp(n, v, 'text', `list="people"${fd.id==='emitente'?' required':''}`));
  if(fd.tipo === 'colaboradores') return fld(fd.label, inp(n, v, 'text', 'placeholder="Nomes separados por vírgula"'));
  if(fd.tipo === 'multi'){
    const vals = Array.isArray(v) ? v : [];
    return fld(fd.label, `<div class="tags">${fd.opcoes.map(o => `<label><input type="checkbox" name="${n}" value="${esc(o)}" ${vals.includes(o)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`);
  }
  return fld(fd.label, inp(n, v));
}
function ckItemHTML(it, c){
  const a = c.answers?.[it.id] || '', note = c.notes?.[it.id] || '';
  return `<div class="ckitem" data-item="${it.id}">
    <div class="check" style="align-items:flex-start"><span>${it.crit?'<b class="crit" title="Item crítico">!</b> ':''}${esc(it.t)}${it.ref?`<span class="small muted" style="display:block">${esc(it.ref)}${it.fonte?' · '+esc(it.fonte):''}</span>`:''}</span>
    <div class="seg" role="radiogroup" aria-label="${esc(it.t)}">${CK_ANS.map(([val,lbl,cls]) => `<label><input type="radio" name="a.${it.id}" value="${val}" ${a===val?'checked':''}><span class="${cls}">${lbl}</span></label>`).join('')}</div></div>
    <div class="ncnote ${a==='NC'?'':'hidden'}">${inp('n.'+it.id, note, 'text', 'placeholder="O que foi encontrado / ação"')}</div>
  </div>`;
}
function ckSectionAttrs(s){ return s.tipo ? `data-tipo="${s.tipo}"` : s.tipoTrabalho ? `data-tt="${esc(s.tipoTrabalho)}"` : ''; }

VIEWS.ckForm = (r) => {
  const isNew = !r.id;
  if(!r.draft){
    const tpl0 = CK_TPL(r.tpl || byId('checklists', r.id)?.tpl);
    if(isNew){
      const now = new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
      const later = new Date(now.getTime()+8*3600000);
      const fields = {};
      if(tpl0?.id === 'pt'){ fields.inicio = now.toISOString().slice(0,16); fields.validade = later.toISOString().slice(0,16); fields.emitente = P.name||''; fields.empresa = 'Tempermax'; fields.tipos = []; }
      r.draft = {id:genId(tpl0?.id==='pt'?'PT':'CHK'), tpl:tpl0?.id, nr:tpl0?.nr, title:tpl0?.titulo, date:nowISO(), responsible:P.name||'', fields, machineId:r.machineId||'', answers:{}, notes:{}, obs:'', media:[]};
    } else r.draft = JSON.parse(JSON.stringify(byId('checklists', r.id)));
    if(r.close){ r.draft.status = 'ENCERRADA'; }
  }
  const c = r.draft, tpl = CK_TPL(c.tpl);
  if(!tpl) return {title:'Checklist', html:'<div class="empty">Modelo não encontrado.</div>'};
  const m = c.machineId ? byId('machines', c.machineId) : null;
  const closing = !!r.close;
  const secs = closing ? tpl.secoes.filter(s => s.encerramento) : tpl.secoes.filter(s => !s.encerramento);
  const vis = s => s.tipo ? (m && m.tipo===s.tipo) : s.tipoTrabalho ? (c.fields.tipos||[]).includes(s.tipoTrabalho) : true;
  return { title: closing ? 'Encerrar PT' : (isNew ? tpl.titulo : 'Editar · '+tpl.titulo), html:`
  <form id="f" autocomplete="off">
    ${closing ? `<div class="panel small" style="margin-bottom:12px"><b>${esc(c.fields.servico||'Serviço')}</b><div class="muted">${esc(c.fields.local||'')} ${esc(c.fields.equip||'')}</div></div>` : `
    <p class="small muted" style="margin:0 0 10px">${esc(tpl.descricao)}</p>
    <fieldset><legend>Identificação</legend>
      <div class="grid2">${fld('Responsável pelo checklist', inp('responsible', c.responsible, 'text', 'required list="people"'))}${fld('Data', `<input type="text" value="${esc(fmtDateTime(c.date))}" disabled>`)}</div>
      ${tpl.campos.map(fd => ckFieldHTML(fd, c)).join('')}
      <datalist id="people">${peopleList()}</datalist>
    </fieldset>
    <p class="small muted" style="margin:-4px 0 10px">Marque cada item: <b>C</b> conforme, <b>NC</b> não conforme, <b>N/A</b> não se aplica. Itens com <b class="crit">!</b> são críticos: se um deles for NC, ${tpl.id==='pt'?'a PT não é liberada':'o equipamento não é liberado'}.</p>`}
    ${secs.map(s => `<fieldset class="cksec ${vis(s)?'':'hidden'}" ${ckSectionAttrs(s)}><legend>${esc(s.titulo)}</legend>${s.itens.map(it => ckItemHTML(it, c)).join('')}</fieldset>`).join('')}
    ${closing ? '' : `
    ${fld('Observações gerais', ta('obs', c.obs))}
    <fieldset><legend>Fotos</legend>
      <div id="media">${mediaHTML(c.media, true)}</div>
      <label class="btn full" style="margin-top:8px">${ICON.plus} Adicionar fotos<input type="file" accept="image/*" multiple id="addphoto" class="hidden"></label>
      <p class="small muted" style="margin:6px 0 0">Até 4 fotos.</p>
    </fieldset>
    ${isNew ? `<label class="row" style="margin-bottom:12px"><input type="checkbox" name="openNc" checked> <span>Se houver item não conforme, abrir não conformidade para acompanhar a correção</span></label>` : ''}`}
    <div class="sticky-save"><button class="btn primary full" type="submit">${closing ? 'Encerrar PT' : isNew ? (tpl.id==='pt'?'Emitir PT':'Registrar checklist') : 'Salvar alterações'}</button></div>
  </form>`, after(){
    const f = $('#f');
    const sync = () => {
      const fd = new FormData(f);
      f.querySelectorAll('.ckitem').forEach(el => { const id = el.dataset.item; el.querySelector('.ncnote').classList.toggle('hidden', fd.get('a.'+id) !== 'NC'); });
      if(f.machineId){ const mm = byId('machines', f.machineId.value); f.querySelectorAll('.cksec[data-tipo]').forEach(s => s.classList.toggle('hidden', !mm || mm.tipo !== s.dataset.tipo)); }
      const tt = fd.getAll('f.tipos'); f.querySelectorAll('.cksec[data-tt]').forEach(s => s.classList.toggle('hidden', !tt.includes(s.dataset.tt)));
    };
    f.addEventListener('change', sync);
    const wireMedia = () => document.querySelectorAll('[data-rmmedia]').forEach(b => b.onclick = () => { c.media.splice(+b.dataset.rmmedia,1); $('#media').innerHTML = mediaHTML(c.media,true); wireMedia(); });
    if($('#addphoto')){
      wireMedia();
      $('#addphoto').onchange = async ev => {
        c.media = c.media || [];
        for(const file of [...ev.target.files]){ if(c.media.length >= 4){ toast('Limite de 4 fotos.'); break; } try{ c.media.push(await compressImage(file)); }catch(e){ toast('Não foi possível ler uma das imagens.'); } }
        $('#media').innerHTML = mediaHTML(c.media,true); wireMedia(); ev.target.value='';
      };
    }
    f.onsubmit = ev => {
      ev.preventDefault();
      const fd = new FormData(f);
      if(!closing){
        c.responsible = trim(fd.get('responsible'));
        if(c.responsible && !P.name){ P.name = c.responsible; savePrefs(); }
        tpl.campos.forEach(fdx => {
          if(fdx.tipo === 'maquina'){ c.machineId = fd.get('machineId') || ''; return; }
          c.fields[fdx.id] = fdx.tipo === 'multi' ? fd.getAll('f.'+fdx.id) : trim(fd.get('f.'+fdx.id));
        });
        if(c.machineId){ const mm = byId('machines', c.machineId); c.fields.maquinaNome = mm ? machLabel(mm) : ''; }
        c.obs = fd.get('obs') || '';
        if(tpl.id === 'pt' && !(c.fields.tipos||[]).length && !confirmDo('Nenhum tipo de trabalho foi marcado. Emitir a PT só com os itens gerais?')) return;
      }
      const visible = [...f.querySelectorAll('.cksec:not(.hidden) .ckitem')];
      const missing = visible.filter(el => !fd.get('a.'+el.dataset.item));
      if(missing.length){ toast(`Falta responder ${missing.length} ${missing.length===1?'item':'itens'}.`); missing[0].scrollIntoView({behavior:'smooth', block:'center'}); return; }
      const ncNoNote = visible.filter(el => fd.get('a.'+el.dataset.item)==='NC' && !trim(fd.get('n.'+el.dataset.item)));
      if(ncNoNote.length){ toast('Descreva o que foi encontrado em cada item NC.'); ncNoNote[0].querySelector('.ncnote input').focus(); return; }
      // guarda só as respostas das seções visíveis (as escondidas são descartadas)
      const keep = new Set(visible.map(el => el.dataset.item));
      if(!closing){ c.answers = {}; c.notes = {}; }
      keep.forEach(id => { c.answers[id] = fd.get('a.'+id); const n = trim(fd.get('n.'+id)); if(c.answers[id]==='NC' && n) c.notes[id] = n; else delete c.notes[id]; });
      const ev2 = ckEval(tpl, c);
      c.result = ev2.result; c.ncCount = ev2.nc.length; c.critNc = ev2.crit.length;
      if(tpl.id === 'pt'){
        if(closing){ c.status = 'ENCERRADA'; c.closedAt = nowISO(); c.closedBy = P.name||''; }
        else if(c.status !== 'ENCERRADA' && c.status !== 'CANCELADA') c.status = ev2.crit.length ? 'NÃO LIBERADA' : 'LIBERADA';
      }
      if(JSON.stringify(c).length > 900000){ toast('O checklist ficou grande demais para sincronizar. Remova uma foto.'); return; }
      upsert('checklists', c);
      logHist(closing ? 'PT encerrada' : isNew ? 'Checklist registrado' : 'Checklist editado', `${tpl.titulo} · ${ckWhat(c)} · ${tpl.id==='pt'?c.status:c.result}`);
      if(isNew && !closing && ev2.nc.length && fd.get('openNc')){
        const mm = c.machineId ? byId('machines', c.machineId) : null;
        upsert('nonConformities', {id:genId('NC'), title:`${tpl.titulo}${ckWhat(c)?' · '+ckWhat(c):''}: ${ev2.nc.length} ${ev2.nc.length===1?'item':'itens'} não conforme${ev2.nc.length===1?'':'s'}`,
          description: ev2.nc.map(i => `- ${i.t}${c.notes[i.id]?': '+c.notes[i.id]:''}`).join('\n'), deadline:'', unitId:S.units[0]?.id||'', exactLocation: mm ? mm.sector : (c.fields.local||c.fields.area||''),
          status:'ABERTO', clientId:S.clients[0]?.id||'CLI-1', responsible:'', correctiveMeasure:'', riskScore:0, sourceId:c.id, photoBefore:'', riskType:'Acidente', riskLevel: ev2.crit.length ? 'ALTO' : 'MODERADO', source:'Checklist '+tpl.nr});
      }
      if(tpl.id==='pt') toast(closing ? 'PT encerrada' : c.status==='LIBERADA' ? 'PT emitida e liberada' : 'PT registrada como NÃO LIBERADA');
      else toast(c.result==='REPROVADO' ? 'Registrado: NÃO LIBERADO' : c.result==='COM PENDÊNCIAS' ? 'Registrado com pendências' : 'Checklist conforme');
      if(isNew){ stack.pop(); stack.push({v:'ck', id:c.id, justSaved:true}); render(true); } else goBack();
    };
  }};
};

VIEWS.ck = (r) => {
  const c = byId('checklists', r.id);
  if(!c) return {title:'Checklist', html:'<div class="empty">Checklist não encontrado.</div>'};
  const tpl = CK_TPL(c.tpl);
  const fdL = tpl ? tpl.campos.map(fd => {
    if(fd.tipo==='maquina') return [fd.label, ckWhat(c)];
    const v = c.fields?.[fd.id]; return [fd.label, fd.tipo==='datahora' ? fmtDateTime(v) : Array.isArray(v) ? v.join(', ') : v];
  }).filter(([,v]) => trim(v)) : [];
  const secs = tpl ? ckVisibleSections(tpl, c) : [];
  const ans = a => a==='C' ? '<span class="chip c-ok">C</span>' : a==='NC' ? '<span class="chip c-venc">NC</span>' : a==='NA' ? '<span class="chip c-n">N/A</span>' : '<span class="chip c-n">—</span>';
  const ev = tpl ? ckEval(tpl, c) : {nc:[], crit:[]};
  const m = c.machineId ? byId('machines', c.machineId) : null;
  return { title: tpl?.titulo || 'Checklist', html:`
    ${r.justSaved ? `<div class="panel stack" style="border-left:7px solid var(--ok);margin-bottom:12px"><b>Registrado.</b><div class="small muted">Envie o PDF e o resumo por WhatsApp ou e-mail.</div><button class="btn primary full" id="sendnow">${ICON.share} Enviar agora</button></div>` : ''}
    <div class="panel stack">
      <div class="row">${ckIcon(c.nr||tpl?.nr||'')}<span class="title grow">${esc(ckWhat(c)||tpl?.titulo||'')}</span>${ckChip(c)}</div>
      <div class="small muted">${fmtDateTime(c.date)} · ${esc(c.responsible||'')}</div>
      ${ev.crit.length ? `<div class="banner" style="background:var(--red-soft);border-color:var(--red);margin:0"><b>${c.tpl==='pt'?'PT não liberada':'Não liberar'}:</b> ${ev.crit.length} ${ev.crit.length===1?'item':'itens'} crítico${ev.crit.length===1?'':'s'} não conforme${ev.crit.length===1?'':'s'}.</div>` : ''}
      ${ptExpired(c) ? '<div class="banner" style="margin:0">A validade desta PT já passou. Encerre ou emita uma nova.</div>' : ''}
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="btn primary" id="sendpdf">${ICON.share} Enviar PDF + resumo</button>
      ${c.tpl==='pt' && c.status==='LIBERADA' ? '<button class="btn" id="close">Encerrar PT</button><button class="btn" id="cancel">Cancelar PT</button>' : ''}
      ${c.status!=='ENCERRADA' && c.status!=='CANCELADA' ? '<button class="btn" id="edit">Editar</button>' : ''}
      ${m ? '<button class="btn" id="seemach">Ver máquina</button>' : ''}
    </div>
    ${ev.nc.length ? `<h2>Itens não conformes (${ev.nc.length})</h2><div class="panel"><ul class="timeline">${ev.nc.map(i=>`<li><div class="grow"><div>${i.crit?'<b class="crit">!</b> ':''}${esc(i.t)}</div><div class="small muted">${esc(c.notes?.[i.id]||'')}</div></div></li>`).join('')}</ul></div>` : ''}
    <h2>Identificação</h2>
    <div class="panel"><dl class="dl">${fdL.map(([l,v])=>`<dt>${esc(l)}</dt><dd>${esc(v)}</dd>`).join('')}
      ${c.closedAt ? `<dt>Encerrada em</dt><dd>${fmtDateTime(c.closedAt)} · ${esc(c.closedBy||'')}</dd>` : ''}
      ${c.obs ? `<dt>Observações</dt><dd>${esc(c.obs)}</dd>` : ''}</dl>
      ${mediaHTML(c.media)}</div>
    ${secs.map(s => `<h2>${esc(s.titulo)}</h2><div class="panel"><ul class="timeline">${s.itens.map(i=>`<li><div class="grow small">${esc(i.t)}${c.notes?.[i.id]?`<div class="muted">${esc(c.notes[i.id])}</div>`:''}</div>${ans(c.answers?.[i.id])}</li>`).join('')}</ul></div>`).join('')}
    <div style="margin-top:22px"><button class="btn danger full" id="del">Excluir</button></div>
  `, after(){
    $('#sendpdf').onclick = ev => sendCkPDF(c, ev.currentTarget);
    $('#sendnow') && ($('#sendnow').onclick = ev => { r.justSaved = false; sendCkPDF(c, ev.currentTarget); });
    $('#edit') && ($('#edit').onclick = () => go('ckForm', {id:c.id}));
    $('#close') && ($('#close').onclick = () => go('ckForm', {id:c.id, close:true}));
    $('#cancel') && ($('#cancel').onclick = () => { if(!confirmDo('Cancelar esta PT? O serviço não poderá ser feito com ela.')) return; c.status = 'CANCELADA'; c.closedAt = nowISO(); c.closedBy = P.name||''; upsert('checklists', c); logHist('PT cancelada', ckWhat(c)); toast('PT cancelada'); render(); });
    $('#seemach') && ($('#seemach').onclick = () => go('mach', {id:m.id}));
    $('#del').onclick = () => { if(confirmDo('Excluir este registro? Isso não pode ser desfeito.')){ removeItem('checklists', c.id); logHist('Exclusão', `${tpl?.titulo||'Checklist'} · ${ckWhat(c)}`); toast('Excluído'); goBack(); } };
  }};
};

/* ---------- máquinas ---------- */
VIEWS.machs = (r) => {
  const q = (r.q||'').toLowerCase(), f = r.f || 'all';
  let ms = [...(S.machines||[])].sort(sortTag);
  if(f==='due') ms = ms.filter(m => machStatus(m).k !== 'ok');
  if(q) ms = ms.filter(m => [m.tag,m.name,m.sector,MACH_TIPOS[m.tipo],m.model].join(' ').toLowerCase().includes(q));
  const missing = CK.maquinas.filter(x => !byId('machines', 'MAQ-'+x.tag)).length;
  return { title:'Máquinas (NR-12)', html:`
    <button class="btn primary scanbig" id="mscan" style="margin-bottom:12px">${ICON.qr} Ler QR code da máquina</button>
    ${missing ? `<div class="panel stack" style="margin-bottom:12px"><div class="small">${(S.machines||[]).length ? `Faltam ${missing} máquinas da lista da AET da Tempermax.` : 'Nenhuma máquina cadastrada ainda.'}</div><button class="btn" id="seed">Carregar as máquinas da Tempermax (${missing})</button></div>` : ''}
    <input class="search" type="search" placeholder="Buscar por tag, nome ou setor" value="${esc(r.q||'')}" id="q" aria-label="Buscar máquina">
    <div class="filters" role="group"><button data-f="all" aria-pressed="${f==='all'}">Todas</button><button data-f="due" aria-pressed="${f==='due'}">A inspecionar</button></div>
    <div class="row" style="margin-bottom:10px"><span class="muted small grow">${ms.length} máquina${ms.length===1?'':'s'}</span><button class="btn" id="labels">Etiquetas</button><button class="btn" id="newm">${ICON.plus} Nova</button></div>
    <div class="list">${ms.map(m => { const st = machStatus(m); return `<button class="card" data-m="${m.id}"><div class="asset">${ckIcon('NR-12')}<b style="font-size:13px">${esc(m.tag)}</b></div><div class="grow"><div class="row"><span class="title grow">${esc(m.name)}</span><span class="chip c-${st.k}">${esc(st.label)}</span></div><div class="sub">${esc(m.sector||'')} · ${esc(MACH_TIPOS[m.tipo]||'')}</div></div></button>`; }).join('') || '<div class="empty">Nenhuma máquina neste filtro.</div>'}</div>
  `, after(){
    const qi = $('#q'); qi.oninput = () => { r.q = qi.value; const pos = qi.selectionStart; render(); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos); };
    document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { r.f = b.dataset.f; render(); });
    $('#mscan').onclick = () => go('mscan');
    $('#newm').onclick = () => go('machForm', {});
    $('#seed') && ($('#seed').onclick = () => {
      let n = 0;
      CK.maquinas.forEach(x => { const id = 'MAQ-'+x.tag; if(!byId('machines', id)){ upsert('machines', {id, tag:x.tag, name:x.nome, sector:x.setor, tipo:x.tipo, model:'', qrCode:'', notes:''}); n++; } });

/* ---------- início ---------- */
(async function boot(){
  await DB.open();
  P = Object.assign(P, await DB.get('prefs') || {});
  /* site: a configuração do Firebase pode vir do arquivo config.js (assim não precisa colar em cada computador) */
  if(!P.firebaseConfig && window.SGTST_FIREBASE && window.SGTST_FIREBASE.apiKey && window.SGTST_FIREBASE.projectId){ P.firebaseConfig = window.SGTST_FIREBASE; savePrefs(); }
  SY = Object.assign(SY, await DB.get('sync') || {});
  const st = await DB.get('state');
  if(st){ S = normalize(st); ensureOccNumbers(); stack = [{v:'home'}]; render(true); }
  else { S = null; const w = VIEWS.welcome(); $('#title').textContent = w.title; $('#view').innerHTML = `<div class="wrap">${w.html}</div>`; w.after(); }
  updateSyncChip();
  Cloud.init();
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState==='hidden'){ saveNow(); stopScanner(); }
    else if(S && ['scan','mscan'].includes(cur().v) && !scan.stream && !$('#scanresult')?.innerHTML) render();
  });
})();
</script>
</body>
</html>
